  /* ---------------- Marks entry tab (per class) ---------------- */

  /* Marks are saved automatically a moment after they are typed; nothing waits for a Save button. */
  var markSaveQueue = {};
  var markSaveTimer = null;
  var markSaving = false;

  function subjectsVisibleForRole(){
    if(profile.role !== "teacher") return classCache.subjects;
    if(isClassTeacherForGrade(profile.id, currentGrade)) return classCache.subjects;
    var ids = assignedSubjectIdsForTeacherInGrade(profile.id, currentGrade);
    return classCache.subjects.filter(function(s){ return ids.indexOf(s.id) !== -1; });
  }
  function summaryForSubjects(studentId, subjectsList){
    var m = classCache.marks[studentId] || {};
    var vals = [];
    subjectsList.forEach(function(s){ var v = m[s.id]; if(v !== undefined && v !== null && v !== "") vals.push(Number(v)); });
    if(vals.length === 0) return { total:null, average:null, count:0 };
    var total = vals.reduce(function(a,b){ return a+b; }, 0);
    return { total:total, average: total/vals.length, count: vals.length };
  }

  /* Marks are entered by the school admin, by the class teacher (all learning areas of the class)
     and by a subject teacher (only the learning areas assigned to him/her in that class) */
  function canEnterMarks(){
    if(!profile) return false;
    if(profile.role === "admin") return true;
    if(profile.role !== "teacher") return false;
    return isClassTeacherForGrade(profile.id, currentGrade) || assignedSubjectIdsForTeacherInGrade(profile.id, currentGrade).length > 0;
  }

  function queueMarkSave(studentId, subjectId, score){
    var examId = currentExamId();
    if(!examId){ setSaveNote("No exam is set for this class, so the mark was not saved.", false, true); return; }
    markSaveQueue[studentId + "|" + subjectId + "|" + examId] = { school_id: currentSchool.id, student_id: studentId, subject_id: subjectId, exam_id: examId, score: score };
    setSaveNote("Saving...", false);
    clearTimeout(markSaveTimer);
    markSaveTimer = setTimeout(flushMarkSaves, 700);
  }
  async function upsertMarkRows(rows){
    try{
      return await sb.from("marks").upsert(rows, { onConflict: "student_id,subject_id,exam_id" });
    } catch(e){ return { error: { message: (e && e.message) ? e.message : String(e), network: true } }; }
  }
  function isNetworkError(err){
    return !!(err && (err.network || /failed to fetch|network|load failed|timeout/i.test(String(err.message || ""))));
  }
  async function flushMarkSaves(){
    clearTimeout(markSaveTimer);
    if(markSaving){ markSaveTimer = setTimeout(flushMarkSaves, 400); return; }
    var keys = Object.keys(markSaveQueue);
    if(keys.length === 0) return;
    var items = keys.map(function(k){ return markSaveQueue[k]; });
    markSaveQueue = {};
    markSaving = true;
    var retry = [];      /* rows to try again later (connection problems) */
    var refused = [];    /* rows the database refused (e.g. not allowed) */
    var reason = "";
    var res = await upsertMarkRows(items);
    if(res.error){
      if(isNetworkError(res.error)){
        retry = items; reason = res.error.message;
      } else if(items.length === 1){
        refused = items; reason = res.error.message || "refused";
      } else {
        /* one refused row must not stop the others: save the rows one at a time */
        for(var i = 0; i < items.length; i++){
          var r = await upsertMarkRows([items[i]]);
          if(r.error){
            if(isNetworkError(r.error)) retry.push(items[i]); else refused.push(items[i]);
            reason = r.error.message || reason;
          }
        }
      }
    }
    markSaving = false;
    if(res.error) console.error(res.error);
    retry.forEach(function(it){
      var k = it.student_id + "|" + it.subject_id + "|" + it.exam_id;
      if(!markSaveQueue[k]) markSaveQueue[k] = it;   /* keep anything newer that was typed meanwhile */
    });
    if(retry.length){
      setSaveNote("No connection - your marks will be saved as soon as it is back...", false, true);
      markSaveTimer = setTimeout(flushMarkSaves, 4000);
    } else if(refused.length){
      setSaveNote("Could not save " + refused.length + " mark(s): " + reason + " (see the guide: marks permission)", false, true);
    } else if(Object.keys(markSaveQueue).length === 0){
      setSaveNote("All marks saved automatically \u2713", true);
    }
  }
  window.addEventListener("beforeunload", function(e){
    if(Object.keys(markSaveQueue).length){ flushMarkSaves(); e.preventDefault(); e.returnValue = ""; }
  });
  document.addEventListener("visibilitychange", function(){ if(document.hidden && Object.keys(markSaveQueue).length) flushMarkSaves(); });

  /* ----- CSV helpers ----- */

  function csvCell(v){
    var s = (v === undefined || v === null) ? "" : String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function parseCSV(text, delim){
    delim = delim || ",";
    text = String(text).replace(/^﻿/, "");
    var rows = [], row = [], cur = "", inQ = false;
    for(var i = 0; i < text.length; i++){
      var ch = text[i];
      if(inQ){
        if(ch === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else { inQ = false; } }
        else cur += ch;
      } else if(ch === '"'){ inQ = true; }
      else if(ch === delim){ row.push(cur); cur = ""; }
      else if(ch === "\n" || ch === "\r"){
        if(ch === "\r" && text[i+1] === "\n") i++;
        row.push(cur); cur = ""; rows.push(row); row = [];
      } else cur += ch;
    }
    if(cur !== "" || row.length){ row.push(cur); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(x){ return String(x).trim() !== ""; }); });
  }
  function downloadTextFile(filename, text, mime){
    var blob = new Blob([text], { type: (mime || "text/plain") + ";charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function safeFilePart(s){ return String(s || "").replace(/[^a-z0-9]+/gi, "_").replace(/^_+|_+$/g, ""); }

  function exportMarksCSV(){
    var subjects = subjectsVisibleForRole();
    var head = ["No", "NAME OF THE LEARNER", "ADM NO"];
    subjects.forEach(function(s){ head.push(s.name); head.push(s.name + " PL"); });
    head.push("TOTAL", "MEAN", "PL");
    var lines = [head.map(csvCell).join(",")];
    classCache.students.forEach(function(st, i){
      var sum = summaryForSubjects(st.id, subjects);
      var line = [i + 1, st.name, st.adm || ""];
      subjects.forEach(function(s){
        var v = (classCache.marks[st.id] || {})[s.id];
        var has = v !== undefined && v !== null && v !== "";
        var g = has ? getGradeInfo(Number(v)) : null;
        line.push(has ? v : "", g ? g.grade : "");
      });
      var ov = getGradeInfo(sum.average);
      line.push(sum.total === null ? "" : sum.total, sum.average === null ? "" : Math.round(sum.average * 100) / 100, ov ? ov.grade : "");
      lines.push(line.map(csvCell).join(","));
    });
    var name = safeFilePart(currentSchool.name) + "_Grade" + currentGrade + "_" + safeFilePart(currentExamName() || "exam") + "_Marks.csv";
    downloadTextFile(name, "﻿" + lines.join("\r\n"), "text/csv");
  }

  /* Header names used on typical broadsheets (ENG, KISW, IN/SC ...) -> position of the learning area */
  var HEADER_ALIASES = {
    eng:0, english:0,
    kisw:1, kis:1, kiswahili:1,
    math:2, maths:2, mathematics:2,
    insc:3, intsc:3, intscie:3, intsci:3, science:3, integratedscience:3,
    cre:4, christianreligiouseducation:4, religiouseducation:4,
    sst:5, socialstudies:5,
    pretec:6, pretech:6, pretechnical:6, pretechnicalstudies:6,
    agrnu:7, agrinut:7, agrinu:7, agriculture:7, agricultureandnutrition:7, agriculturenutrition:7,
    cas:8, casports:8, creativearts:8, creativeartsandsports:8
  };
  function hkey(s){ return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
  function normName(s){
    return String(s || "").toLowerCase().replace(/['’`]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  }
  function tokenKey(s){ return normName(s).split(" ").filter(Boolean).sort().join(" "); }
  function isNameHeader(raw){
    var k = hkey(raw);
    return ["nameofthelearner","name","learner","learnername","student","studentname","fullname","names"].indexOf(k) !== -1;
  }
  function isSkippedHeader(raw){
    var k = hkey(raw);
    if(/(^|[\s_.\-])p\.?l$/i.test(String(raw).trim())) return true;                       /* the PL (performance level) columns */
    return ["total","totalmarks","mean","meanscore","average","avg","rank","position","no","sno","s","gender","sex","pl","level","overalllevel"].indexOf(k) !== -1;
  }
  function matchSubjectForHeader(raw){
    var k = hkey(raw);
    var subs = subjectsVisibleForRole();
    var exact = subs.find(function(s){ return hkey(s.name) === k; });
    if(exact) return exact;
    if(Object.prototype.hasOwnProperty.call(HEADER_ALIASES, k)){
      var rank = HEADER_ALIASES[k];
      var byRank = subs.find(function(s){ return subjectSortRank(s.name) === rank; });
      if(byRank) return byRank;
    }
    if(k.length >= 4){
      var part = subs.find(function(s){ var sk = hkey(s.name); return sk.indexOf(k) !== -1 || k.indexOf(sk) !== -1; });
      if(part) return part;
    }
    return null;
  }

  /* Read a CSV and work out which mark belongs in which learner / learning-area cell */
  function buildImportPlan(text){
    var first = String(text).split(/\r?\n/)[0] || "";
    var delim = ",";
    var n1 = (first.match(/,/g) || []).length, n2 = (first.match(/;/g) || []).length, n3 = (first.match(/\t/g) || []).length;
    if(n2 > n1 && n2 >= n3) delim = ";"; else if(n3 > n1 && n3 > n2) delim = "\t";
    var rows = parseCSV(text, delim);
    if(rows.length < 2) return { error: "That file has no learner rows." };
    var hi = -1;
    for(var i = 0; i < Math.min(rows.length, 10); i++){
      if(rows[i].some(function(h){ return isNameHeader(h); })){ hi = i; break; }
    }
    if(hi < 0) return { error: "Could not find the learner name column. The first row should have a heading such as NAME OF THE LEARNER." };
    var header = rows[hi];
    var nameCol = -1, admCol = -1, subjCols = [], ignored = [], usedSubjects = {};
    header.forEach(function(h, idx){
      var raw = String(h || "").trim();
      if(!raw) return;
      var k = hkey(raw);
      if(nameCol < 0 && isNameHeader(raw)){ nameCol = idx; return; }
      if(admCol < 0 && ["adm","admno","admissionno","admissionnumber","admission"].indexOf(k) !== -1){ admCol = idx; return; }
      if(isSkippedHeader(raw)) return;
      var sub = matchSubjectForHeader(raw);
      if(sub && !usedSubjects[sub.id]){ usedSubjects[sub.id] = true; subjCols.push({ idx: idx, subject: sub, header: raw }); }
      else ignored.push(raw);
    });
    if(subjCols.length === 0) return { error: "None of the column headings match the learning areas set up for this class." };

    var byName = {}, byTokens = {}, byAdm = {};
    classCache.students.forEach(function(st){
      byName[normName(st.name)] = st;
      byTokens[tokenKey(st.name)] = st;
      if(st.adm) byAdm[String(st.adm).trim().toLowerCase()] = st;
    });

    var entries = [], unmatched = [], bad = 0, matchedIds = {};
    for(var r = hi + 1; r < rows.length; r++){
      var row = rows[r];
      var nm = String(row[nameCol] || "").trim();
      if(!nm) continue;
      var st = byName[normName(nm)] || byTokens[tokenKey(nm)] || (admCol >= 0 && byAdm[String(row[admCol] || "").trim().toLowerCase()]) || null;
      var anyNumber = false;
      subjCols.forEach(function(sc){
        var cell = String(row[sc.idx] === undefined ? "" : row[sc.idx]).trim();
        if(cell === "" || cell === "-") return;
        var num = Number(cell);
        if(isNaN(num) || num < 0 || num > 100){ bad++; return; }
        anyNumber = true;
        if(st) entries.push({ student: st, subject: sc.subject, score: num });
      });
      if(st) matchedIds[st.id] = true;
      else if(anyNumber) unmatched.push(nm);
    }
    return { entries: entries, unmatched: unmatched, ignored: ignored, bad: bad, learners: Object.keys(matchedIds).length, subjects: subjCols.map(function(s){ return s.subject.name; }) };
  }

    html += '<th style="min-width:70px;">Total</th><th style="min-width:70px;">Average</th><th style="min-width:70px;">Level</th></tr></thead><tbody>';

    classCache.students.forEach(function(st, idx){

        } else {

        }
      });
      html += '<td class="cell-total">'+(sum.total===null?"-":sum.total)+'</td>';
      html += '<td class="cell-avg">'+(sum.average===null?"-":sum.average.toFixed(1))+'</td>';
      html += '<td class="cell-level">'+gradePillHTML(sum.average)+'</td></tr>';
    });
    html += '</tbody></table></div>' +
      '<p class="section-hint" style="margin:12px 0 0;">Total and average count the subjects that already have a mark entered.</p></div>';

    c.innerHTML = html;

    c.querySelector("#exportMarksBtn").onclick = exportMarksCSV;
    if(!canEnter) return;

    c.querySelectorAll("[data-mark-student]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var sid = inp.getAttribute("data-mark-student");
        var subid = inp.getAttribute("data-mark-subject");
        var raw = inp.value;
        var n = null;
        if(raw !== ""){
          n = Number(raw);
          if(isNaN(n)) n = null;
          else {
            var clamped = Math.max(0, Math.min(100, n));
            if(clamped !== n){ n = clamped; inp.value = n; }
          }
        }
        if(!classCache.marks[sid]) classCache.marks[sid] = {};
        if(n === null) delete classCache.marks[sid][subid]; else classCache.marks[sid][subid] = n;

        var row = inp.closest("tr");
        var sum = summaryForSubjects(sid, subjects);
        row.querySelector(".cell-total").textContent = sum.total===null ? "-" : sum.total;
        row.querySelector(".cell-avg").textContent = sum.average===null ? "-" : sum.average.toFixed(1);
        row.querySelector(".cell-level").innerHTML = gradePillHTML(sum.average);
        queueMarkSave(sid, subid, n);
      });
      inp.addEventListener("change", function(){ flushMarkSaves(); });
    });

    var impInput = c.querySelector("#marksImportFile");
    impInput.onchange = function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        showImportPreview(c.querySelector("#marksImportPreview"), buildImportPlan(String(reader.result)));
        impInput.value = "";
      };
      reader.readAsText(file);
    };
  }

  function showImportPreview(box, plan){
    if(plan.error){
      box.innerHTML = '<div class="panel" style="border-color:var(--coral);"><strong style="color:var(--coral);">Could not read that file.</strong><p class="section-hint" style="margin:6px 0 0;">'+esc(plan.error)+'</p></div>';
      return;
    }
    var html = '<div class="panel"><h3>Check before importing</h3>' +
      '<p style="margin:0 0 8px;"><strong>'+plan.entries.length+'</strong> mark(s) for <strong>'+plan.learners+'</strong> learner(s) will be placed in: ' + esc(plan.subjects.join(", ")) + '.</p>';
    if(plan.unmatched.length) html += '<p class="section-hint" style="color:var(--coral);margin:0 0 6px;">Learners not found in this class (skipped): '+esc(plan.unmatched.slice(0,12).join(", "))+(plan.unmatched.length>12?' ...and '+(plan.unmatched.length-12)+' more':'')+'.</p>';
    if(plan.ignored.length) html += '<p class="section-hint" style="margin:0 0 6px;">Columns that did not match a learning area (ignored): '+esc(plan.ignored.join(", "))+'.</p>';
    if(plan.bad) html += '<p class="section-hint" style="color:var(--coral);margin:0 0 6px;">'+plan.bad+' value(s) were not a number from 0 to 100 and were skipped.</p>';
    html += '<p class="section-hint" style="margin:0 0 10px;">Existing marks are replaced only where the file has a value; empty cells in the file leave the current mark untouched.</p>' +

        queueMarkSave(en.student.id, en.subject.id, en.score);
      });
      await flushMarkSaves();
      renderTab();
    };
  }

  /* Print from the page itself. #printArea is hidden by default, so it has to be shown first - otherwise the printout is blank. */
  function printHtml(html, landscape){
    var pa = document.getElementById("printArea");
    pa.innerHTML = html;
    pa.style.display = "block";
    var pageStyle = document.createElement("style");
    pageStyle.textContent = "@media print{ @page{ size:" + (landscape ? "A4 landscape" : "A4") + "; margin:10mm; } }";
    document.head.appendChild(pageStyle);
    function done(){
      pa.style.display = "none";
      if(pageStyle.parentNode) pageStyle.parentNode.removeChild(pageStyle);
      window.removeEventListener("afterprint", done);
    }
    window.addEventListener("afterprint", done);
    var imgs = Array.prototype.slice.call(pa.querySelectorAll("img"));
    var waits = imgs.map(function(im){
      return new Promise(function(res){
        function decoded(){ if(im.decode){ im.decode().then(res, res); } else { res(); } }
        if(im.complete && im.naturalWidth > 0){ decoded(); return; }
        im.onload = decoded; im.onerror = function(){ res(); };
      });
    });
    Promise.race([Promise.all(waits), new Promise(function(res){ setTimeout(res, 4000); })]).then(function(){
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(function(){ window.print(); }, 250); }); });
    });
  }

  function downloadHtmlFile(filename, html){
    var blob = new Blob([html], { type: "text/html;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function downloadMarklistFile(mode, showUngraded, rankOption){
    var sch = currentSchool;
    var doc = printableFileWrapper("Marklist", buildMarklistHTML(mode, showUngraded, rankOption), "A4 landscape");
    var safeName = (sch.name || "marklist").replace(/[^a-z0-9]+/gi, "_");
    var safeExam = (currentExamName() || "exam").replace(/[^a-z0-9]+/gi, "_");
    downloadHtmlFile(safeName + "_Grade" + currentGrade + "_" + safeExam + "_Marklist.html", doc);
  }

  var SHEET_CODES = ["ENG","KISW","MATH","IN/SC","CRE","SST","PRE-TEC","AGR/NU","CA&S"];
  function subjectCode(name){
    var r = subjectSortRank(name);
    if(r < SHEET_CODES.length) return SHEET_CODES[r];
    return String(name || "").toUpperCase().slice(0, 8);
  }
  function fmt2(n){ return (Math.round(n * 100) / 100).toFixed(2); }

  function buildMarklistHTML(mode, showUngraded, rankOption){
    mode = mode === "points" ? "points" : "marks";
    var sch = currentSchool;
    var subjects = subjectsVisibleForRole();
    var marklistStudents = showUngraded ? classCache.students : classCache.students.filter(function(st){ return summaryForSubjects(st.id, subjects).average !== null; });

    rankOption = (rankOption === "order" || rankOption === "keep") ? rankOption : "none";
    var rankEnabled = rankOption !== "none";

    /* Marks mode ranks by average marks; points mode ranks by total points */
    function rankScore(st){
      if(mode === "points"){
        var t = 0, n = 0;
        subjects.forEach(function(s){
          var v = (classCache.marks[st.id] || {})[s.id];
          if(v !== undefined && v !== null && v !== ""){
            var g = getGradeInfo(Number(v));
            if(g){ t += g.points; n++; }
          }
        });
        return n ? t : null;
      }
      return summaryForSubjects(st.id, subjects).average;
    }

    var positionById = {};
    var orderedStudents = marklistStudents;
    if(rankEnabled){
      var scored = marklistStudents.map(function(st, i){ return { st: st, i: i, score: rankScore(st) }; });
      var withScore = scored.filter(function(x){ return x.score !== null; })
        .sort(function(a,b){ return (b.score - a.score) || (a.i - b.i); });
      var rank = 0, lastScore = null, seen = 0;
      withScore.forEach(function(x){
        seen++;
        if(x.score !== lastScore){ rank = seen; lastScore = x.score; }
        positionById[x.st.id] = rank;
      });
      if(rankOption === "order"){
        var withoutScore = scored.filter(function(x){ return x.score === null; });
        orderedStudents = withScore.concat(withoutScore).map(function(x){ return x.st; });
      }
    }

    var examName = currentExamName();
    var examTY = examTermYear(currentExamId());
    var head = '<div class="report-card" style="max-width:100%;">' +
      '<div class="rc-head">' + (sch.logo ? '<img src="'+sch.logo+'" alt="School logo" style="max-height:60px;max-width:170px;margin-bottom:8px;">' : '') +
      '<h2>'+esc((sch.name || "Junior School").toUpperCase())+'</h2>' +
      '<div class="rc-sub" style="font-size:14px;font-weight:700;color:#222;">GRADE '+esc(currentGrade)+' &nbsp; '+esc((examName || "Exam").toUpperCase())+' &nbsp; '+esc((examTY.term || "").toUpperCase())+' '+esc(examTY.year || "")+'</div>' +
      '<div class="rc-sub" style="font-weight:700;letter-spacing:1px;">'+(mode === "points" ? "POINTS LIST" : "BROADSHEET")+'</div></div>';

    if(mode === "points"){
      var h1 = (rankEnabled ? '<th style="width:50px;">Position</th>' : '<th style="width:40px;">S/NO</th>') + '<th>NAME OF THE LEARNER</th>';
      subjects.forEach(function(s){ h1 += '<th title="'+esc(s.name)+'">'+esc(subjectCode(s.name))+'</th>'; });
      h1 += '<th>Total points</th><th>Average points</th>';
      var prow = orderedStudents.map(function(st, idx){
        var row = '<tr><td>'+(rankEnabled ? (positionById[st.id] || "-") : (idx + 1))+'</td><td class="nm">'+esc(st.name)+'</td>';
        var tp = 0, cnt = 0;
        subjects.forEach(function(s){
          var v = (classCache.marks[st.id] || {})[s.id];
          var g = (v !== undefined && v !== null && v !== "") ? getGradeInfo(Number(v)) : null;
          if(g){ tp += g.points; cnt++; }
          row += '<td>'+(g ? g.points : "-")+'</td>';
        });
        return row + '<td>'+(cnt ? tp : "-")+'</td><td>'+(cnt ? (tp / cnt).toFixed(1) : "-")+'</td></tr>';
      }).join("");
      var psum = '<tr class="ft"><td></td><td class="nm">Subject Mean</td>';
      var ptot = 0, pcnt = 0;
      subjects.forEach(function(s){
        var m = subjectMean(s.id); var g = m === null ? null : getGradeInfo(m);
        if(g){ ptot += g.points; pcnt++; }
        psum += '<td>'+(g ? g.points : "-")+'</td>';
      });
      psum += '<td>-</td><td>'+(pcnt ? (ptot / pcnt).toFixed(1) : "-")+'</td></tr>';
      var pblanks = '';
      for(var pb = 0; pb < subjects.length + 2; pb++) pblanks += '<td></td>';
      var prub = '<tr class="ft"><td></td><td class="nm">'+rubricHeaderHtml()+'</td>'+pblanks+'</tr>';
      gradeScale().slice().sort(function(a,b){ return b.min - a.min; }).forEach(function(lv){
        var pr = '<tr><td></td><td class="nm">'+rubricLevelHtml(lv)+'</td>';
        subjects.forEach(function(s){
          var cnt = 0;
          marklistStudents.forEach(function(st){
            var v = (classCache.marks[st.id] || {})[s.id];
            if(v !== undefined && v !== null && v !== ""){ var g = getGradeInfo(Number(v)); if(g && g.grade === lv.grade) cnt++; }
          });
          pr += '<td>'+cnt+'</td>';
        });
        prub += pr + '<td></td><td></td></tr>';
      });
      return head + '<div class="table-wrap"><table class="broadsheet"><thead><tr>'+h1+'</tr></thead><tbody>'+prow+psum+prub+'</tbody></table></div></div>';
    }

    /* ----- Marks mode: broadsheet laid out like the school's own marklist ----- */
    var nSub = subjects.length;
    var th = '<th style="width:46px;">'+(rankEnabled ? "RANK" : "S/NO")+'</th><th style="text-align:left;min-width:170px;">NAME OF THE LEARNER</th>';
    subjects.forEach(function(s){ th += '<th title="'+esc(s.name)+'">'+esc(subjectCode(s.name))+'</th><th>PL</th>'; });
    th += '<th>TOTAL</th><th>MEAN</th><th>PL</th>';

    var body = orderedStudents.map(function(st, idx){
      var sum = summaryForSubjects(st.id, subjects);
      var overall = getGradeInfo(sum.average);
      var row = '<tr><td>'+(rankEnabled ? (positionById[st.id] || "-") : (idx + 1))+'</td><td class="nm">'+esc(st.name)+'</td>';
      subjects.forEach(function(s){
        var v = (classCache.marks[st.id] || {})[s.id];
        var has = v !== undefined && v !== null && v !== "";
        var g = has ? getGradeInfo(Number(v)) : null;
        row += '<td>'+(has ? esc(v) : "-")+'</td><td>'+(g ? esc(g.grade) : "-")+'</td>';
      });
      row += '<td><strong>'+(sum.total === null ? "-" : sum.total)+'</strong></td>' +
        '<td>'+(sum.average === null ? "-" : fmt2(sum.average))+'</td>' +
        '<td>'+(overall ? esc(overall.grade) : "-")+'</td></tr>';
      return row;
    }).join("");

    var totals = [], means = [];
    marklistStudents.forEach(function(st){
      var s = summaryForSubjects(st.id, subjects);
      if(s.total !== null){ totals.push(s.total); means.push(s.average); }
    });
    function avgOf(a){ return a.length ? a.reduce(function(x,y){ return x + y; }, 0) / a.length : null; }
    var avgTotal = avgOf(totals), avgMean = avgOf(means);
    var avgLevel = avgMean === null ? null : getGradeInfo(avgMean);

    var meanRow = '<tr class="ft"><td></td><td class="nm">MEAN</td>';
    var plRow = '<tr class="ft"><td></td><td class="nm">P.L</td>';
    subjects.forEach(function(s){
      var m = subjectMean(s.id);
      var g = m === null ? null : getGradeInfo(m);
      meanRow += '<td>'+(m === null ? "-" : fmt2(m))+'</td><td></td>';
      plRow += '<td></td><td>'+(g ? esc(g.grade) : "-")+'</td>';
    });
    meanRow += '<td>'+(avgTotal === null ? "-" : fmt2(avgTotal))+'</td><td>'+(avgMean === null ? "-" : fmt2(avgMean))+'</td><td></td></tr>';
    plRow += '<td></td><td></td><td>'+(avgLevel ? esc(avgLevel.grade) : "-")+'</td></tr>';

    /* How many learners reached each level of the school's grading scale (from Set up) */
    var blanks = '';
    for(var b = 0; b < nSub * 2 + 3; b++) blanks += '<td></td>';
    var rubric = '<tr class="ft"><td></td><td class="nm">'+rubricHeaderHtml()+'</td>'+blanks+'</tr>';
    gradeScale().slice().sort(function(a,b){ return b.min - a.min; }).forEach(function(lv){
      var r = '<tr><td></td><td class="nm">'+rubricLevelHtml(lv)+'</td>';
      subjects.forEach(function(s){
        var cnt = 0;
        marklistStudents.forEach(function(st){
          var v = (classCache.marks[st.id] || {})[s.id];
          if(v !== undefined && v !== null && v !== ""){ var g = getGradeInfo(Number(v)); if(g && g.grade === lv.grade) cnt++; }
        });
        r += '<td></td><td>'+cnt+'</td>';
      });
      var overallCnt = 0;
      marklistStudents.forEach(function(st){
        var s = summaryForSubjects(st.id, subjects);
        var g = getGradeInfo(s.average);
        if(g && g.grade === lv.grade) overallCnt++;
      });
      r += '<td></td><td></td><td>'+overallCnt+'</td></tr>';
      rubric += r;
    });

    return head + '<div class="table-wrap"><table class="broadsheet"><thead><tr>'+th+'</tr></thead><tbody>'+body+meanRow+plRow+rubric+'</tbody></table></div></div>';
  }

  function rubricHeaderHtml(){
    return '<span class="rb rb-l">RUBRICS</span><span class="rb rb-r">RANGE</span><span class="rb rb-p">POINTS</span>';
  }
  function rubricLevelHtml(lv){
    return '<span class="rb rb-l">'+esc(lv.grade)+'</span><span class="rb rb-r">'+esc(lv.min)+'-'+esc(lv.max)+'</span><span class="rb rb-p">'+esc(lv.points !== undefined ? lv.points : "")+'</span>';
  }

  function subjectMean(subjectId){
    var sum = 0, count = 0;
    classCache.students.forEach(function(st){
      var v = (classCache.marks[st.id] || {})[subjectId];
      if(v !== undefined && v !== null && v !== ""){ sum += Number(v); count++; }
    });
    return count ? sum / count : null;
  }

  /* ---------------- Analysis tab (per class) ---------------- */

  async function fetchExamMarksMap(examId){
    if(!examId) return {};
    var subjectIds = classCache.subjects.map(function(s){ return s.id; });
    var studentIds = classCache.students.map(function(s){ return s.id; });
    if(!subjectIds.length || !studentIds.length) return {};
    var res = await sb.from("marks").select("*").in("student_id", studentIds).in("subject_id", subjectIds).eq("exam_id", examId);
    var map = {};
    (res.data || []).forEach(function(m){
      if(m.score === null || m.score === undefined) return;
      if(!map[m.student_id]) map[m.student_id] = {};
      map[m.student_id][m.subject_id] = Number(m.score);
    });
    return map;
  }
  function summaryFromMarksMap(studentId, map){
    var m = map[studentId] || {};
    var vals = [];
    classCache.subjects.forEach(function(s){ var v = m[s.id]; if(v !== undefined && v !== null && v !== "") vals.push(Number(v)); });
    if(vals.length === 0) return { total:null, average:null };
    var total = vals.reduce(function(a,b){ return a+b; }, 0);
    return { total:total, average: total/vals.length };
  }

  async function renderAnalysis(c){
    var html = '<h2 class="section-title">Class Analysis &mdash; Grade '+esc(currentGrade)+'</h2>' +
      '<p class="section-hint">A summary of how the class performed, updated live from the marks entered.</p>';

    if(classCache.subjects.length === 0 || classCache.students.length === 0){
      html += '<div class="empty-state"><strong>Nothing to analyze yet</strong>Add subjects, students, and marks first.</div>';

  var SMS_PRICE_KES = 1; // price per SMS shown to admins; the real price is set on the server (SMS_PRICE_KES secret) and must match this
  var SMS_SENDER_NAME = "BRIPKSOFT"; // must match the Sender ID registered with your SMS provider (max 11 chars, no spaces)

  /* The sender shown on parents' phones: the school's name (letters and numbers only, max 11 characters).
     If the school row has an sms_sender_id column filled in, that exact value is used instead. */
  function smsSenderName(){
    var sch = currentSchool || {};
    var custom = String(sch.sms_sender_id || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 11);
    if(custom) return custom;
    var fromName = String(sch.name || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 11);
    return fromName || SMS_SENDER_NAME;
  }

  /* SMS access = super admin permission + paid credits + school admin switched on */
  function smsGate(){
    var sch = currentSchool || {};
    var credits = Number(sch.sms_credits) || 0;
    if(!sch.sms_permission) return { ok:false, credits:credits, reason:"SMS sending has not been enabled for your school. Buy SMS in the School tab (M-Pesa); the platform super admin will then approve your school." };
    if(credits <= 0) return { ok:false, credits:credits, reason:"Your paid SMS balance is finished. Buy more SMS in the School tab (M-Pesa), then try again." };
    if(!sch.sms_admin_enabled) return { ok:false, credits:credits, reason:"SMS is approved but switched off. Turn on \u201cAllow SMS sending\u201d in the School tab first." };
    return { ok:true, credits:credits, reason:"" };
  }

  /* Confirmation text listing the phone number(s) the SMS will go to */
  function smsConfirmText(intro, recipients, credits){
    var lines = recipients.slice(0, 10).map(function(r){ return "\u2022 " + r.name + " \u2014 " + r.parentPhone; });
    if(recipients.length > 10) lines.push("...and " + (recipients.length - 10) + " more");
    return intro + "\n\n" + lines.join("\n") + "\n\nThis will use " + recipients.length + " of your " + credits + " paid SMS. Please check the number(s) are correct before sending.";
  }

  }

  async function smsFailReason(res){
    try{
      if(res.data && res.data.error) return String(res.data.error);
      if(res.error && res.error.context && typeof res.error.context.json === "function"){
        var b = await res.error.context.json();
        if(b && b.error) return String(b.error);
      }
    }catch(e){}
    return (res.error && res.error.message) ? String(res.error.message) : "Unknown error";
  }

  function fmtLongDate(iso){
    if(!iso) return "";
    var p = String(iso).slice(0,10).split("-");
    if(p.length !== 3) return String(iso);
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    if(isNaN(d.getTime())) return String(iso);
    return d.toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" });
  }

    /* Sends several SMS at the same time instead of one after another (much faster for a whole class) */
    var SMS_PARALLEL = 5;
    async function sendSmsFast(recipients, messageFor, statusEl){
      var sent = 0, failed = 0, lastReason = "", done = 0, next = 0;
      var sender = smsSenderName();
      async function worker(){
        while(next < recipients.length){
          var r = recipients[next++];
          var res;
          try{ res = await sb.functions.invoke("send-sms", { body: { phone: r.parentPhone, message: messageFor(r), senderId: sender } }); }
          catch(e){ res = { error: e }; }
          if(res.error || (res.data && res.data.error)){ failed++; lastReason = await smsFailReason(res); } else sent++;
          done++;
          statusEl.textContent = "Sent " + done + " of " + recipients.length + "...";
        }
      }
      var workers = [];
      for(var w = 0; w < Math.min(SMS_PARALLEL, recipients.length); w++) workers.push(worker());
      await Promise.all(workers);
      return { sent: sent, failed: failed, lastReason: lastReason };
    }

      await ensureExamLoaded();
      var statusEl = c.querySelector("#smsStatus");
      var mode = smsResultsMode.value;
      var recipients;
      if(mode === "single"){
        var st = classCache.students.find(function(s){ return s.id === studentSelect.value; });
        if(!st){ return; }
        if(!st.parentPhone){ statusEl.textContent = "No parent phone number saved for "+st.name+". Add one in the Students tab first."; return; }
        recipients = [st];
      } else if(mode === "all"){
        recipients = classCache.students.filter(function(s){ return s.parentPhone; });
      } else {
        var checked = Array.prototype.slice.call(c.querySelectorAll("[data-sms-results-student]:checked"));
        var ids = checked.map(function(cb){ return cb.getAttribute("data-sms-results-student"); });
        recipients = classCache.students.filter(function(s){ return ids.indexOf(s.id) !== -1; });
      }
      if(recipients.length === 0){ statusEl.textContent = "No parent phone numbers to send to — check the Students tab, or choose at least one parent above."; return; }
      var gate = smsGate();
      if(!gate.ok){ statusEl.textContent = gate.reason; return; }
      if(recipients.length > gate.credits){ statusEl.textContent = "You only have "+gate.credits+" paid SMS left but selected "+recipients.length+" parent(s). Choose fewer parents or top up with the super admin."; return; }
      if(!confirm(smsConfirmText("Send exam results by SMS to "+recipients.length+" parent(s)?", recipients, gate.credits))) return;

      var btn = c.querySelector("#smsOneBtn");
      btn.disabled = true;
      statusEl.textContent = "Sending...";
      var out = await sendSmsFast(recipients, buildResultsMessage, statusEl);
      var sent = out.sent, failed = out.failed, lastReason = out.lastReason;
      btn.disabled = false;
      await refreshSchoolSmsInfo();
      statusEl.textContent = "Done: "+sent+" sent, "+failed+" failed. SMS balance left: "+(Number(currentSchool.sms_credits)||0)+"." + (failed && lastReason ? " Reason: " + lastReason : "");
    };

    var composeMode = c.querySelector("#composeMode");
    var composeChooseList = c.querySelector("#composeChooseList");
    composeMode.onchange = function(){
      composeChooseList.style.display = composeMode.value === "choose" ? "block" : "none";
    };

    /* No school phone number is needed to send: the message goes out under the platform's sender name. */
    c.querySelector("#composeSendBtn").onclick = async function(){
      var composeStatus = c.querySelector("#composeStatus");
      var message = c.querySelector("#composeMessage").value.trim();
      if(!message){ composeStatus.textContent = "Type a message first."; return; }

      var recipients;
      if(composeMode.value === "all"){
        recipients = classCache.students.filter(function(s){ return s.parentPhone; });
      } else {
        var checked = Array.prototype.slice.call(c.querySelectorAll("[data-compose-student]:checked"));
        var ids = checked.map(function(cb){ return cb.getAttribute("data-compose-student"); });
        recipients = classCache.students.filter(function(s){ return ids.indexOf(s.id) !== -1; });
      }
      if(recipients.length === 0){ composeStatus.textContent = "No parent phone numbers to send to — check the Students tab, or choose at least one parent above."; return; }
      var gate2 = smsGate();
      if(!gate2.ok){ composeStatus.textContent = gate2.reason; return; }
      if(recipients.length > gate2.credits){ composeStatus.textContent = "You only have "+gate2.credits+" paid SMS left but selected "+recipients.length+" parent(s). Choose fewer parents or top up with the super admin."; return; }
      if(!confirm(smsConfirmText("Send this message to "+recipients.length+" parent(s)?", recipients, gate2.credits))) return;

      var btn = c.querySelector("#composeSendBtn");
      btn.disabled = true;
      composeStatus.textContent = "Sending...";
      var out2 = await sendSmsFast(recipients, function(){ return message; }, composeStatus);
      var sent = out2.sent, failed = out2.failed, lastReason = out2.lastReason;
      btn.disabled = false;
      await refreshSchoolSmsInfo();
      composeStatus.textContent = "Done: "+sent+" sent, "+failed+" failed. SMS balance left: "+(Number(currentSchool.sms_credits)||0)+"." + (failed && lastReason ? " Reason: " + lastReason : "");
    };
  }

  function downloadReportCardFile(studentId, examLabel, examId){
    var sch = currentSchool;
    var st = classCache.students.find(function(s){ return s.id === studentId; });
    var doc = printableFileWrapper("Report Card", buildReportCardHTML(studentId, examLabel, null, examId), "A4");
    var safeName = ((st && st.name) || "report_card").replace(/[^a-z0-9]+/gi, "_");
    var safeExam = (examLabel || currentExamName() || "exam").replace(/[^a-z0-9]+/gi, "_");
    downloadHtmlFile(safeName + "_Grade" + currentGrade + "_" + safeExam + "_ReportCard.html", doc);
  }

  /* The class teacher's remark: written as a sentence about the learner, kept apart from the per-subject comments */
  function teacherRemarkSentence(st, sum, items){
    var first = String(st.name || "").trim().split(/\s+/)[0] || "The learner";
    first = first.charAt(0).toUpperCase() + first.slice(1).toLowerCase();
    var g = getGradeInfo(sum.average);
    if(!g) return "No marks have been recorded for " + first + " yet.";
    var cat = g.category || g.grade.slice(0,2);
    var avg = sum.average.toFixed(1);
    var s;
    if(cat === "EE") s = first + " has done exceptionally well, exceeding expectations with a mean of " + avg + " (" + g.grade + "). Keep up the excellent work.";
    else if(cat === "ME") s = first + " is meeting expectations with a mean of " + avg + " (" + g.grade + ") and shows a good grasp of the competencies covered. With a little more practice, " + first + " can reach the next level.";
    else if(cat === "AE") s = first + " is approaching expectations with a mean of " + avg + " (" + g.grade + "). More practice and revision are needed to master the competencies covered.";
    else s = first + " is performing below expectations with a mean of " + avg + " (" + g.grade + "). Close support and regular practice are strongly recommended.";
    if(items.length >= 2){
      var sorted = items.slice().sort(function(a,b){ return b.score - a.score; });
      var best = sorted[0], worst = sorted[sorted.length - 1];
      if(best.score !== worst.score) s += " " + first + " did best in " + best.name + " (" + best.score + ") and needs more attention in " + worst.name + " (" + worst.score + ").";
    }
    return s;
  }

  function buildReportCardHTML(studentId, examLabel, ov, examId){
    var sch = currentSchool;
    var ty = (examId && typeof examId === "object") ? { term: examId.term || sch.term || "", year: examId.year || sch.year || "" } : (examId ? examTermYear(examId) : { term: sch.term || "", year: sch.year || "" });
    var st = classCache.students.find(function(s){ return s.id === studentId; });
    if(!st) return "";
    var sum = studentSummary(studentId);
    var rankData = rankedStudents();
    var posEntry = rankData.ranked.find(function(r){ return r.student.id === studentId; });
    var position = posEntry ? posEntry.position : null;
    if(ov){ position = ov.position || null; rankData = { totalRanked: ov.total || 0 }; }

    var items = [];
    var rows = classCache.subjects.map(function(s){
      var v = (classCache.marks[studentId] || {})[s.id];
      var hasVal = v !== undefined && v !== null && v !== "";
      var g = hasVal ? getGradeInfo(Number(v)) : null;
      if(hasVal) items.push({ name: s.name, score: Number(v) });
      var tname = (ov && ov.teachers) ? (ov.teachers[s.id] || null) : subjectTeacherName(currentGrade, s.id);
      tname = cleanTeacherName(tname);
      return '<tr><td>'+esc(s.name)+'</td><td style="text-align:center;">'+(hasVal?v:"-")+'</td>' +
        '<td style="text-align:center;">'+(g?g.grade:"-")+'</td><td>'+(g?esc(g.remark):"-")+'</td>' +
        '<td>'+(tname?esc(tname):"-")+'</td></tr>';
    }).join("");

    var overallGrade = getGradeInfo(sum.average);
    var d = reportDates();
    var datesHtml = (d.closing || d.opening)
      ? '<div class="rc-dates">' +
        (d.closing ? '<div><strong>School closes:</strong> '+esc(fmtLongDate(d.closing))+'</div>' : '') +
        (d.opening ? '<div><strong>School opens:</strong> '+esc(fmtLongDate(d.opening))+'</div>' : '') +
        '</div>'
      : '';

    var termAvgHtml = "";
    var tad = rcTermAvgData && rcTermAvgData[studentId];
    if(tad){
      var tg = getGradeInfo(tad.avg);
      termAvgHtml = '<div class="rc-info" style="margin-top:6px;"><div><strong>Term average:</strong> ' + tad.avg.toFixed(1) +
        (tg ? ' (' + esc(tg.grade) + ')' : '') +
        ' <span style="font-size:12px;color:#555;">&mdash; average of ' + tad.count + ' exam' + (tad.count === 1 ? '' : 's') + ': ' + esc(tad.names.join(", ")) + '</span></div></div>';
    }

    return '<div class="report-card rc-a4">' +
      '<div class="rc-head">' + (sch.logo ? '<img src="'+sch.logo+'" alt="School logo" style="max-height:60px;max-width:170px;margin-bottom:8px;">' : '') + '<h2>'+esc(sch.name || "Junior School")+'</h2>' +
      '<div class="rc-sub">'+esc(examLabel || currentExamName() || "Exam")+' &middot; '+esc(ty.term || "")+' '+esc(ty.year || "")+'</div></div>' +
      '<div class="rc-info"><div><strong>Name:</strong> '+esc(st.name)+'</div>' +
      '<div><strong>Admission No.:</strong> '+esc(st.adm || "-")+'</div>' +
      '<div><strong>Class:</strong> Grade '+esc(currentGrade)+'</div></div>' +
      datesHtml +
      '<table><thead><tr><th>Subject</th><th style="text-align:center;">Marks</th><th style="text-align:center;">Level</th><th>Comments</th><th>Teacher</th></tr></thead>' +
      '<tbody>'+rows+'</tbody></table>' +
      '<div class="rc-info" style="margin-top:14px;">' +
      '<div><strong>Total:</strong> '+(sum.total===null?"-":sum.total)+'</div>' +
      '<div><strong>Average:</strong> '+(sum.average===null?"-":sum.average.toFixed(1))+'</div>' +
      '<div><strong>Overall level:</strong> '+(overallGrade?esc(overallGrade.grade)+" ("+esc(overallGrade.category||"")+")":"-")+'</div>' +
      '<div><strong>Position:</strong> '+(position?position+" out of "+rankData.totalRanked:"-")+'</div></div>' +
      termAvgHtml +
      '<div class="rc-remark"><span class="label">Class teacher\'s remarks</span><div class="sentence">'+esc(teacherRemarkSentence(st, sum, items))+'</div></div>' +
      '<div class="rc-foot"><div>Class Teacher&rsquo;s Signature</div><div>Head Teacher&rsquo;s Signature</div><div>Parent/Guardian&rsquo;s Signature</div></div>' +
      '</div>';
  }

  /* ---------------- Boot ---------------- */

  async function boot(){
    try{
      var hash = window.location.hash || "";
      var isRecovery = hash.indexOf("type=recovery") !== -1;
      var sessRes = await sb.auth.getSession();
      var session = sessRes.data && sessRes.data.session;
      if(isRecovery && session){ renderSetNewPassword(); return; }
      if(session){
        try{
          var rawImp = sessionStorage.getItem(IMP_KEY);
          if(rawImp){ var impObj = JSON.parse(rawImp); if(impObj && impObj.superId && impObj.superId !== session.user.id) impersonating = impObj; else sessionStorage.removeItem(IMP_KEY); }
        }catch(e){}
        await handleSignedIn(session.user);
      }
      else { renderApp(); await tryRestoreLearner(); }
    } catch(e){
      showFatalError(e);
      renderApp();
    }
  }

  function showFatalError(e){
    console.error(e);
    var msg = (e && e.message) ? e.message : String(e);
    var banner = document.getElementById("fatalErrorBanner");
    if(!banner){
      banner = document.createElement("div");
      banner.id = "fatalErrorBanner";
      banner.style.cssText = "position:fixed;top:0;left:0;right:0;background:#B23A2E;color:#fff;padding:10px 16px;font-family:sans-serif;font-size:13px;z-index:9999;text-align:center;";
      document.body.insertBefore(banner, document.body.firstChild);
    }
    banner.textContent = "Something went wrong loading the app: " + msg + " (please screenshot this message)";
  }

  window.addEventListener("error", function(e){ showFatalError(e.error || e.message || e); });
  window.addEventListener("unhandledrejection", function(e){ showFatalError(e.reason); });

  boot();
})();
</script>

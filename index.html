<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRIPK SOFTWARE</title>
<style>
  :root{
    --paper:#FAF7EE;
    --paper-dark:#F1ECDE;
    --ink:#2A2A26;
    --ink-soft:#6B6559;
    --board:#25402F;
    --board-light:#345643;
    --pen:#B23A2E;
    --gold:#C99A3C;
    --line:#D9D2BE;
    --ok:#3E7A4C;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;
    line-height:1.45;
  }
  #app{max-width:1180px;margin:0 auto;padding:0 0 60px;}

  /* ---------- Header ---------- */
  header.topbar{
    background:var(--board);
    color:var(--paper);
    padding:22px 28px 18px;
    border-bottom:5px solid var(--gold);
  }
  .header-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  header.topbar h1{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  header.topbar .sub{
    color:#CFE0D3;
    font-size:13.5px;
  }
  .role-badge{
    display:inline-block;background:var(--gold);color:#2A2A26;font-size:11px;font-weight:700;
    padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle;text-transform:capitalize;
  }
  .logout-btn{
    appearance:none;background:transparent;border:1px solid #6B9280;color:var(--paper);
    padding:7px 14px;border-radius:4px;font-size:12.5px;cursor:pointer;flex-shrink:0;
  }
  .logout-btn:hover{background:var(--board-light);}
  .meta-strip{
    display:flex;
    flex-wrap:wrap;
    gap:10px 22px;
    margin-top:14px;
  }
  .meta-field{display:flex;flex-direction:column;gap:2px;}
  .meta-field label{font-size:11px;color:#B9CFC0;text-transform:none;}
  .meta-field input, .meta-field select{
    background:var(--board-light);
    border:1px solid #46685A;
    color:var(--paper);
    border-radius:4px;
    padding:5px 8px;
    font-size:13.5px;
    min-width:120px;
  }
  .meta-field input::placeholder{color:#A9C2B3;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px;}
  .login-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:32px 30px;width:320px;max-width:100%;box-shadow:0 4px 18px rgba(0,0,0,0.06);}
  .login-card h2{font-family:Georgia,"Times New Roman",serif;color:var(--board);margin:0 0 4px;font-size:20px;}
  .login-card p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 18px;}
  .login-card .field{margin-bottom:12px;display:flex;flex-direction:column;gap:4px;}
  .login-card .field label{font-size:12px;color:var(--ink-soft);}
  .login-card input{width:100%;}
  .login-card button{width:100%;margin-top:6px;}
  .login-error{color:var(--pen);font-size:13px;margin:10px 0 0;min-height:16px;}

  /* ---------- Tabs ---------- */
  nav.tabs{
    display:flex;
    gap:2px;
    padding:0 28px;
    background:var(--paper-dark);
    border-bottom:2px solid var(--line);
    overflow-x:auto;
  }
  nav.tabs button{
    appearance:none;
    border:none;
    background:transparent;
    padding:12px 18px;
    font-size:14px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.active{
    color:var(--board);
    border-bottom:3px solid var(--pen);
  }

  main{padding:26px 28px 10px;}

  h2.section-title{
    font-family:Georgia,"Times New Roman",serif;
    font-size:20px;
    margin:0 0 4px;
    color:var(--board);
  }
  p.section-hint{
    color:var(--ink-soft);
    font-size:13.5px;
    margin:0 0 18px;
  }

  /* ---------- Cards & Panels ---------- */
  .panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:20px;
  }
  .panel h3{
    margin:0 0 12px;
    font-size:15px;
    color:var(--board);
    font-family:Georgia,"Times New Roman",serif;
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:12px;color:var(--ink-soft);}
  input[type=text], input[type=number], input[type=password], select{
    border:1px solid var(--line);
    border-radius:4px;
    padding:7px 9px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
  }
  input:focus, select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  input:disabled{background:#F1EFE7;color:#9C978A;}

  button.btn{
    appearance:none;
    border:1px solid var(--board);
    background:var(--board);
    color:#fff;
    padding:8px 16px;
    border-radius:4px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  button.btn:hover{background:var(--board-light);}
  button.btn.secondary{
    background:#fff;
    color:var(--board);
  }
  button.btn.secondary:hover{background:var(--paper-dark);}
  button.btn.danger{
    background:#fff;
    color:var(--pen);
    border-color:var(--pen);
  }
  button.btn.danger:hover{background:#FBEEEC;}
  button.icon-x{
    border:none;background:none;color:var(--pen);cursor:pointer;font-size:15px;line-height:1;padding:4px 6px;
  }

  table{border-collapse:collapse;width:100%;font-size:13.5px;}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;}
  th{background:var(--paper-dark);color:var(--board);font-weight:700;}
  tbody tr:nth-child(even){background:#FCFAF3;}
  .table-wrap{overflow-x:auto;}

  .mark-input{width:64px;text-align:center;}
  .subject-teacher-tag{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:400;margin-top:2px;}
  .grade-pill{
    display:inline-block;
    min-width:44px;
    text-align:center;
    padding:2px 7px;
    border-radius:999px;
    font-weight:700;
    font-size:12.5px;
    color:#fff;
    background:var(--ink-soft);
  }
  .grade-EE{background:var(--ok);}
  .grade-ME{background:#4C8FAE;}
  .grade-AE{background:var(--gold);}
  .grade-BE{background:var(--pen);}

  .empty-state{
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:34px 20px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty-state strong{display:block;color:var(--ink);margin-bottom:6px;font-size:15px;}

  .stat-grid{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
  .stat-box{
    flex:1 1 150px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .stat-box .label{font-size:12px;color:var(--ink-soft);}
  .stat-box .value{font-family:Georgia,serif;font-size:24px;color:var(--board);font-weight:700;}
  .stat-box .value.small{font-size:16px;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .bar-row .bar-label{width:150px;font-size:13px;flex-shrink:0;}
  .bar-track{flex:1;background:var(--paper-dark);border-radius:3px;height:16px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--board);}
  .bar-row .bar-value{width:46px;text-align:right;font-size:13px;font-weight:600;flex-shrink:0;}

  .report-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 30px;
    max-width:640px;
  }
  .report-card .rc-head{text-align:center;border-bottom:2px solid var(--board);padding-bottom:12px;margin-bottom:14px;}
  .report-card .rc-head h2{margin:0 0 4px;font-family:Georgia,serif;color:var(--board);font-size:21px;}
  .report-card .rc-head .rc-sub{font-size:13px;color:var(--ink-soft);}
  .rc-info{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:14px;flex-wrap:wrap;gap:6px;}
  .rc-remark{
    margin-top:16px;
    border-top:1px dashed var(--line);
    padding-top:12px;
    font-size:13.5px;
  }
  .rc-remark .label{color:var(--ink-soft);font-size:12px;display:block;margin-bottom:2px;}
  .rc-foot{display:flex;justify-content:space-between;margin-top:26px;font-size:12.5px;color:var(--ink-soft);}
  .rc-foot div{border-top:1px solid var(--ink-soft);padding-top:4px;width:150px;text-align:center;}

  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .save-note{font-size:12px;color:var(--ink-soft);}
  .save-note.saved{color:var(--ok);}

  @media (max-width:640px){
    header.topbar{padding:18px 16px;}
    main{padding:18px 16px;}
    nav.tabs{padding:0 16px;}
    .meta-field input, .meta-field select{min-width:100px;}
  }

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;left:0;top:0;width:100%;}
    .no-print{display:none !important;}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div id="app">

  <div id="loginView"></div>

  <div id="mainView" style="display:none;">
    <header class="topbar">
      <div class="header-top-row">
        <div>
          <img id="schoolLogoImg" alt="School logo" style="display:none;max-height:42px;max-width:130px;border-radius:4px;margin-bottom:6px;">
          <h1 id="schoolNameDisplay">BRIPK SOFTWARE</h1>
          <div class="sub" id="roleSub"></div>
        </div>
        <button class="logout-btn no-print" id="logoutBtn">Log out</button>
      </div>
      <div class="meta-strip no-print" id="metaStrip"></div>
    </header>

    <nav class="tabs no-print" id="tabs"></nav>

    <main id="content"></main>
  </div>

</div>

<div id="printArea"></div>

<script>
(function(){

  /* ---------------- Supabase connection ---------------- */

  var SUPABASE_URL = "https://xvkvrxvlgslbdmffwzfk.supabase.co";
  var SUPABASE_KEY = "sb_publishable_6yc_ObllapIJuB6bQL9SvQ_hePKDhs9";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var CLASS_GRADES = ["7","8","9"];

  var DEFAULT_GRADE_SCALE = [
    {min:90,max:100,grade:"EE1",category:"EE",points:8,remark:"Exceeding Expectation - exceptional mastery"},
    {min:75,max:89, grade:"EE2",category:"EE",points:7,remark:"Exceeding Expectation - very good mastery"},
    {min:65,max:74, grade:"ME1",category:"ME",points:6,remark:"Meeting Expectation - good grasp of competencies"},
    {min:55,max:64, grade:"ME2",category:"ME",points:5,remark:"Meeting Expectation - fair grasp of competencies"},
    {min:45,max:54, grade:"AE1",category:"AE",points:4,remark:"Approaching Expectation - developing, needs practice"},
    {min:35,max:44, grade:"AE2",category:"AE",points:3,remark:"Approaching Expectation - inconsistent, needs support"},
    {min:25,max:34, grade:"BE1",category:"BE",points:2,remark:"Below Expectation - needs close support"},
    {min:0, max:24, grade:"BE2",category:"BE",points:1,remark:"Below Expectation - needs significant support"}
  ];

  /* ---------------- App state (in-memory cache, backed by Supabase) ---------------- */

  var authUser = null;      // Supabase auth user
  var profile = null;       // {id, full_name, role, school_id, email}
  var currentSchool = null; // the signed-in admin/teacher's school row
  var schoolsList = [];     // super admin: all schools
  var teachersList = [];    // admin/teacher: teachers in the current school
  var assignmentsList = []; // admin/teacher: assignments in the current school
  var currentGrade = "7";
  var currentTab = null;
  var classCache = { subjects: [], students: [], marks: {} };

  function esc(s){
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function setSaveNote(text, ok){
    var el = document.getElementById("saveNote");
    if(!el) return;
    el.textContent = text;
    el.className = "save-note" + (ok ? " saved" : "");
  }

  function friendlyError(err){
    if(!err) return "Something went wrong.";
    return err.message || String(err);
  }

  /* ---------------- Image compression (unchanged) ---------------- */

  function readImageAsCompressedDataURL(file, maxDim, quality, callback){
    function processBlob(blob){
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){
        URL.revokeObjectURL(url);
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw;
        canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        var dataUrl;
        try{ dataUrl = canvas.toDataURL("image/jpeg", quality || 0.82); } catch(e){ dataUrl = null; }
        callback(dataUrl);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); callback(null); };
      img.src = url;
    }
    var looksHeic = /\.hei[cf]$/i.test(file.name || "") || /hei[cf]/i.test(file.type || "");
    if(looksHeic && typeof heic2any === "function"){
      heic2any({ blob: file, toType: "image/jpeg", quality: quality || 0.82 }).then(function(converted){
        processBlob(Array.isArray(converted) ? converted[0] : converted);
      }).catch(function(){ processBlob(file); });
    } else {
      processBlob(file);
    }
  }

  /* ---------------- Auth ---------------- */

  async function handleSignedIn(user){
    authUser = user;
    var res = await sb.from("profiles").select("*").eq("id", user.id).single();
    if(res.error || !res.data){
      await sb.auth.signOut();
      authUser = null;
      renderApp();
      renderLogin("signin", null, "Your account isn't set up yet. Ask your school or platform admin to finish setting it up, then try again.");
      return;
    }
    profile = res.data;
    currentTab = null;
    currentGrade = "7";
    if(profile.role !== "super"){
      var schRes = await sb.from("schools").select("*").eq("id", profile.school_id).single();
      currentSchool = schRes.data || null;
      if(currentSchool && currentSchool.is_active === false){
        await sb.auth.signOut();
        authUser = null; profile = null; currentSchool = null;
        renderApp();
        renderLogin("signin", null, "This school has been deactivated by the platform admin. Please contact them for more information.");
        return;
      }
      await loadSchoolMeta();
    }
    renderApp();
  }

  async function doLogout(){
    try{ await sb.auth.signOut(); } catch(e){}
    authUser = null; profile = null; currentSchool = null;
    schoolsList = []; teachersList = []; assignmentsList = [];
    document.getElementById("content").innerHTML = "";
    document.getElementById("tabs").innerHTML = "";
    document.getElementById("metaStrip").innerHTML = "";
    renderApp();
  }

  async function loadSchoolMeta(){
    if(!currentSchool) return;
    var teachersQ = sb.from("profiles").select("id, full_name, email").eq("school_id", currentSchool.id).eq("role","teacher").order("full_name");
    var assignQ = sb.from("assignments").select("*").eq("school_id", currentSchool.id);
    var results = await Promise.all([teachersQ, assignQ]);
    teachersList = results[0].data || [];
    assignmentsList = results[1].data || [];
  }

  async function loadClassData(){
    if(!currentSchool){ classCache = { subjects: [], students: [], marks: {} }; return; }
    var subjectsQ = sb.from("subjects").select("*").eq("school_id", currentSchool.id).eq("grade", currentGrade).order("name");
    var studentsQ = sb.from("students").select("*").eq("school_id", currentSchool.id).eq("grade", currentGrade).order("name");
    var results = await Promise.all([subjectsQ, studentsQ]);
    var subjects = results[0].data || [];
    var students = results[1].data || [];
    var marksMap = {};
    if(subjects.length && students.length){
      var subjectIds = subjects.map(function(s){ return s.id; });
      var studentIds = students.map(function(s){ return s.id; });
      var markRes = await sb.from("marks").select("*").in("student_id", studentIds).in("subject_id", subjectIds);
      (markRes.data || []).forEach(function(m){
        if(m.score === null || m.score === undefined) return;
        if(!marksMap[m.student_id]) marksMap[m.student_id] = {};
        marksMap[m.student_id][m.subject_id] = Number(m.score);
      });
    }
    classCache = {
      subjects: subjects.map(function(s){ return { id:s.id, name:s.name }; }),
      students: students.map(function(s){ return { id:s.id, name:s.name, adm:s.admission_no || "" }; }),
      marks: marksMap
    };
  }

  /* ---------------- Grading helpers (operate on cached data) ---------------- */

  function gradeScale(){ return (currentSchool && currentSchool.grade_scale) || DEFAULT_GRADE_SCALE; }

  function getGradeInfo(avg){
    if(avg === null || avg === undefined || isNaN(avg)) return null;
    var scale = gradeScale().slice().sort(function(a,b){ return b.min - a.min; });
    for(var i=0;i<scale.length;i++){ if(avg >= scale[i].min) return scale[i]; }
    return scale[scale.length-1];
  }

  function gradePillHTML(avg){
    var g = getGradeInfo(avg);
    if(!g) return '<span class="grade-pill">-</span>';
    var cat = g.category || g.grade.slice(0,2);
    return '<span class="grade-pill grade-'+esc(cat)+'" title="'+esc(g.remark||"")+'">'+esc(g.grade)+'</span>';
  }

  function studentMarksArray(studentId){
    var m = classCache.marks[studentId] || {};
    var vals = [];
    classCache.subjects.forEach(function(s){
      var v = m[s.id];
      if(v !== undefined && v !== null && v !== "") vals.push(Number(v));
    });
    return vals;
  }

  function studentSummary(studentId){
    var vals = studentMarksArray(studentId);
    if(vals.length === 0) return { total:null, average:null, count:0 };
    var total = vals.reduce(function(a,b){return a+b;},0);
    return { total:total, average: total/vals.length, count: vals.length };
  }

  function rankedStudents(){
    var rows = classCache.students.map(function(st){
      return { student: st, summary: studentSummary(st.id) };
    });
    var withAvg = rows.filter(function(r){ return r.summary.average !== null; });
    withAvg.sort(function(a,b){ return b.summary.average - a.summary.average; });
    var rank = 0, lastAvg = null, seen = 0;
    withAvg.forEach(function(r){
      seen++;
      if(r.summary.average !== lastAvg){ rank = seen; lastAvg = r.summary.average; }
      r.position = rank;
    });
    var noAvg = rows.filter(function(r){ return r.summary.average === null; });
    return { ranked: withAvg, unranked: noAvg, totalRanked: withAvg.length };
  }

  function subjectStats(subjectId){
    var vals = [];
    classCache.students.forEach(function(st){
      var v = (classCache.marks[st.id] || {})[subjectId];
      if(v !== undefined && v !== null && v !== "") vals.push(Number(v));
    });
    if(vals.length === 0) return { mean:null, high:null, low:null, count:0 };
    var mean = vals.reduce(function(a,b){return a+b;},0) / vals.length;
    return { mean:mean, high:Math.max.apply(null,vals), low:Math.min.apply(null,vals), count:vals.length };
  }

  function overallClassMean(){
    var all = [];
    classCache.students.forEach(function(st){ all = all.concat(studentMarksArray(st.id)); });
    if(all.length === 0) return null;
    return all.reduce(function(a,b){return a+b;},0) / all.length;
  }

  function autoRemark(avg){
    var g = getGradeInfo(avg);
    if(!g) return "No marks recorded yet.";
    var cat = g.category || g.grade.slice(0,2);
    if(cat === "EE") return "Exceeding Expectation. An outstanding grasp of the competencies covered.";
    if(cat === "ME") return "Meeting Expectation. A g

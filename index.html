  if("serviceWorker" in navigator){

  }
  .empty-state strong{display:block;color:var(--ink);margin-bottom:6px;font-size:15px;}

  .stat-grid{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
  .stat-box{

  .stat-box .value{font-family:Georgia,serif;font-size:24px;color:var(--board);font-weight:700;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .bar-row .bar-label{width:150px;font-size:13px;flex-shrink:0;}
  .bar-track{flex:1;background:var(--paper-dark);border-radius:3px;height:16px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--board);}
  .bar-row .bar-value{width:46px;text-align:right;font-size:13px;font-weight:600;flex-shrink:0;}

  .report-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 30px;
    max-width:640px;
  }
  .report-card .rc-head{text-align:center;border-bottom:2px solid var(--board);padding-bottom:12px;margin-bottom:14px;}
  .report-card .rc-head h2{margin:0 0 4px;font-family:Georgia,serif;color:var(--board);font-size:21px;}
  .report-card .rc-head .rc-sub{font-size:13px;color:var(--ink-soft);}
  .rc-info{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:14px;flex-wrap:wrap;gap:6px;}

    .report-card .rc-foot{ margin-top:16px; }

</style>

<script>
(function(){

  /* ---------------- Supabase connection ---------------- */

  var SUPABASE_URL = "https://xvkvrxvlgslbdmffwzfk.supabase.co";
  var SUPABASE_KEY = "sb_publishable_6yc_ObllapIJuB6bQL9SvQ_hePKDhs9";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var CLASS_GRADES = ["7","8","9"];
  var PRIMARY_GRADES = ["1","2","3","4","5","6"];

  var DEFAULT_GRADE_SCALE = [
    {min:90,max:100,grade:"EE1",category:"EE",points:8,remark:"Exceeding Expectation - exceptional mastery"},
    {min:75,max:89, grade:"EE2",category:"EE",points:7,remark:"Exceeding Expectation - very good mastery"},
    {min:58,max:74, grade:"ME1",category:"ME",points:6,remark:"Meeting Expectation - good grasp of competencies"},
    {min:41,max:57, grade:"ME2",category:"ME",points:5,remark:"Meeting Expectation - fair grasp of competencies"},
    {min:31,max:40, grade:"AE1",category:"AE",points:4,remark:"Approaching Expectation - developing, needs practice"},
    {min:21,max:30, grade:"AE2",category:"AE",points:3,remark:"Approaching Expectation - inconsistent, needs support"},
    {min:11,max:20, grade:"BE1",category:"BE",points:2,remark:"Below Expectation - needs close support"},
    {min:1, max:10, grade:"BE2",category:"BE",points:1,remark:"Below Expectation - needs significant support"}
  ];

  var PRIMARY_GRADE_SCALE = [
    {min:75,max:100,grade:"EE",category:"EE",points:4,remark:"Exceeding Expectation"},
    {min:50,max:74, grade:"ME",category:"ME",points:3,remark:"Meeting Expectation"},
    {min:25,max:49, grade:"AE",category:"AE",points:2,remark:"Approaching Expectation"},
    {min:1, max:24, grade:"BE",category:"BE",points:1,remark:"Below Expectation"}
  ];

  function gradesForSchool(sch){
    return (sch && sch.level === "primary") ? PRIMARY_GRADES : CLASS_GRADES;
  }

  var SUBJECT_ORDER_KEYWORDS = [
    ["english"],
    ["kiswahili"],
    ["mathematics","maths"],
    ["integratedscience","science"],
    ["christianreligious","religiouseducation"],
    ["socialstudies"],
    ["pretechnical"],
    ["agriculture","nutrition"],
    ["creativearts"]
  ];
  var SUBJECT_ORDER_CODES = ["eng","kisw","math","intscie","cre","sst","pretech","agrinut","cas"];
  function subjectSortRank(name){
    var key = (name || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    for(var i=0; i<SUBJECT_ORDER_KEYWORDS.length; i++){
      for(var j=0; j<SUBJECT_ORDER_KEYWORDS[i].length; j++){
        if(key.indexOf(SUBJECT_ORDER_KEYWORDS[i][j]) !== -1) return i;
      }
    }
    var codeIdx = SUBJECT_ORDER_CODES.indexOf(key);
    if(codeIdx !== -1) return codeIdx;
    return SUBJECT_ORDER_KEYWORDS.length;
  }
  function sortSubjectsList(list){
    return list.slice().sort(function(a,b){
      var ra = subjectSortRank(a.name), rb = subjectSortRank(b.name);
      if(ra !== rb) return ra - rb;
      return a.name.localeCompare(b.name);
    });
  }

  /* ---------------- App state (in-memory cache, backed by Supabase) ---------------- */

  var authUser = null;      // Supabase auth user
  var profile = null;       // {id, full_name, role, school_id, email}
  var currentSchool = null; // the signed-in admin/teacher's school row
  var schoolsList = [];     // super admin: all schools
  var teachersList = [];    // admin/teacher: teachers in the current school
  var assignmentsList = []; // admin/teacher: assignments in the current school
  var examHistory = [];     // admin: past exam names used by this school, newest first
  var classSubscriptions = []; // admin/teacher: this school's per-grade payment records
  var currentGrade = "7";
  var currentTab = null;
  var classCache = { subjects: [], students: [], marks: {} };

  function esc(s){
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function setSaveNote(text, ok){
    var el = document.getElementById("saveNote");
    if(!el) return;
    el.textContent = text;
    el.className = "save-note" + (ok ? " saved" : "");
  }

  function friendlyError(err){
    if(!err) return "Something went wrong.";
    return err.message || String(err);
  }

  /* ---------------- Image compression (unchanged) ---------------- */

  function readImageAsCompressedDataURL(file, maxDim, quality, callback){
    function processBlob(blob){
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function(){
        URL.revokeObjectURL(url);
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw;
        canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        var dataUrl;
        try{ dataUrl = canvas.toDataURL("image/jpeg", quality || 0.82); } catch(e){ dataUrl = null; }
        callback(dataUrl);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); callback(null); };
      img.src = url;
    }
    var looksHeic = /\.hei[cf]$/i.test(file.name || "") || /hei[cf]/i.test(file.type || "");
    if(looksHeic && typeof heic2any === "function"){
      heic2any({ blob: file, toType: "image/jpeg", quality: quality || 0.82 }).then(function(converted){
        processBlob(Array.isArray(converted) ? converted[0] : converted);
      }).catch(function(){ processBlob(file); });
    } else {
      processBlob(file);
    }
  }

  /* ---------------- Auth ---------------- */

  async function handleSignedIn(user){
    try{
      authUser = user;
      var res = await sb.from("profiles").select("*").eq("id", user.id).single();
      if(res.error || !res.data){
        await sb.auth.signOut();
        authUser = null;
        renderApp();
        renderLogin("signin", null, "Your account isn't set up yet. Ask your school or platform admin to finish setting it up, then try again.");
        return;
      }
      profile = res.data;
      currentTab = null;
      currentGrade = "7";
      if(profile.role !== "super"){
        var schRes = await sb.from("schools").select("*").eq("id", profile.school_id).single();
        currentSchool = schRes.data || null;
        if(currentSchool && currentSchool.is_active === false){
          await sb.auth.signOut();
          authUser = null; profile = null; currentSchool = null;
          renderApp();
          renderLogin("signin", null, "This school has been deactivated by the platform admin. Please contact them for more information.");
          return;
        }
        await loadSchoolMeta();
        currentGrade = gradesForSchool(currentSchool)[0];
      }
      renderApp();
    } catch(e){
      showFatalError(e);
      authUser = null; profile = null;
      renderApp();
    }
  }

  async function doLogout(){
    try{ await sb.auth.signOut(); } catch(e){}
    authUser = null; profile = null; currentSchool = null;
    schoolsList = []; teachersList = []; assignmentsList = []; examHistory = []; classSubscriptions = [];
    document.getElementById("content").innerHTML = "";
    document.getElementById("tabs").innerHTML = "";
    document.getElementById("metaStrip").innerHTML = "";
    renderApp();
  }

  async function loadSchoolMeta(){
    if(!currentSchool) return;
    var teachersQ = sb.from("profiles").select("id, full_name, email").eq("school_id", currentSchool.id).eq("role","teacher").order("full_name");
    var assignQ = sb.from("assignments").select("*").eq("school_id", currentSchool.id);
    var examsQ = sb.from("exams").select("*").eq("school_id", currentSchool.id).order("created_at", { ascending:false });
    var subsQ = sb.from("class_subscriptions").select("*").eq("school_id", currentSchool.id);
    var results = await Promise.all([teachersQ, assignQ, examsQ, subsQ]);
    teachersList = results[0].data || [];
    assignmentsList = results[1].data || [];
    examHistory = results[2].data || [];
    classSubscriptions = results[3].data || [];
  }

  function isGradePaid(grade){
    var rec = classSubscriptions.find(function(r){ return r.grade === grade; });
    if(!rec || !rec.paid_until) return false;
    return new Date(rec.paid_until).getTime() > Date.now();
  }

  async function rememberExamName(name){
    name = (name || "").trim();
    if(!name || !currentSchool) return;
    var already = examHistory.some(function(e){ return e.name.toLowerCase() === name.toLowerCase(); });
    if(already) return;
    var res = await sb.from("exams").insert({ school_id: currentSchool.id, name: name }).select().single();
    if(!res.error && res.data) examHistory.unshift(res.data);
  }

  async function loadClassData(){
    if(!currentSchool){ classCache = { subjects: [], students: [], marks: {} }; return; }
    var subjectsQ = sb.from("subjects").select("*").eq("school_id", currentSchool.id).eq("grade", currentGrade).order("name");
    var studentsQ = sb.from("students").select("*").eq("school_id", currentSchool.id).eq("grade", currentGrade).order("name");
    var results = await Promise.all([subjectsQ, studentsQ]);
    var subjects = results[0].data || [];
    var students = results[1].data || [];
    var marksMap = {};
    if(subjects.length && students.length){
      var subjectIds = subjects.map(function(s){ return s.id; });
      var studentIds = students.map(function(s){ return s.id; });
      var markRes = await sb.from("marks").select("*").in("student_id", studentIds).in("subject_id", subjectIds);
      (markRes.data || []).forEach(function(m){
        if(m.score === null || m.score === undefined) return;
        if(!marksMap[m.student_id]) marksMap[m.student_id] = {};
        marksMap[m.student_id][m.subject_id] = Number(m.score);
      });
    }
    classCache = {
      subjects: sortSubjectsList(subjects.map(function(s){ return { id:s.id, name:s.name }; })),
      students: students.map(function(s){ return { id:s.id, name:s.name, adm:s.admission_no || "", parentPhone:s.parent_phone || "" }; }),
      marks: marksMap
    };
  }

  /* ---------------- Grading helpers (operate on cached data) ---------------- */

  function gradeScale(){ return (currentSchool && currentSchool.grade_scale) || DEFAULT_GRADE_SCALE; }

  function getGradeInfo(avg){
    if(avg === null || avg === undefined || isNaN(avg)) return null;
    var scale = gradeScale().slice().sort(function(a,b){ return b.min - a.min; });
    for(var i=0;i<scale.length;i++){ if(avg >= scale[i].min) return scale[i]; }
    return scale[scale.length-1];
  }

  function gradePillHTML(avg){
    var g = getGradeInfo(avg);
    if(!g) return '<span class="grade-pill">-</span>';
    var cat = g.category || g.grade.slice(0,2);
    return '<span class="grade-pill grade-'+esc(cat)+'" title="'+esc(g.remark||"")+'">'+esc(g.grade)+'</span>';
  }

  function studentMarksArray(studentId){
    var m = classCache.marks[studentId] || {};
    var vals = [];
    classCache.subjects.forEach(function(s){
      var v = m[s.id];
      if(v !== undefined && v !== null && v !== "") vals.push(Number(v));
    });
    return vals;
  }

  function studentSummary(studentId){
    var vals = studentMarksArray(studentId);
    if(vals.length === 0) return { total:null, average:null, count:0 };
    var total = vals.reduce(function(a,b){return a+b;},0);
    return { total:total, average: total/vals.length, count: vals.length };
  }

  function rankedStudents(){
    var rows = classCache.students.map(function(st){
      return { student: st, summary: studentSummary(st.id) };
    });
    var withAvg = rows.filter(function(r){ return r.summary.average !== null; });
    withAvg.sort(function(a,b){ return b.summary.average - a.summary.average; });
    var rank = 0, lastAvg = null, seen = 0;
    withAvg.forEach(function(r){
      seen++;
      if(r.summary.average !== lastAvg){ rank = seen; lastAvg = r.summary.average; }
      r.position = rank;
    });
    var noAvg = rows.filter(function(r){ return r.summary.average === null; });
    return { ranked: withAvg, unranked: noAvg, totalRanked: withAvg.length };
  }

  function subjectStats(subjectId){
    var vals = [];
    classCache.students.forEach(function(st){
      var v = (classCache.marks[st.id] || {})[subjectId];
      if(v !== undefined && v !== null && v !== "") vals.push(Number(v));
    });
    if(vals.length === 0) return { mean:null, high:null, low:null, count:0 };
    var mean = vals.reduce(function(a,b){return a+b;},0) / vals.length;
    return { mean:mean, high:Math.max.apply(null,vals), low:Math.min.apply(null,vals), count:vals.length };
  }

  function overallClassMean(){
    var all = [];
    classCache.students.forEach(function(st){ all = all.concat(studentMarksArray(st.id)); });
    if(all.length === 0) return null;
    return all.reduce(function(a,b){return a+b;},0) / all.length;
  }

  function autoRemark(avg){
    var g = getGradeInfo(avg);
    if(!g) return "No marks recorded yet.";
    var cat = g.category || g.grade.slice(0,2);
    if(cat === "EE") return "Exceeding Expectation. An outstanding grasp of the competencies covered.";
    if(cat === "ME") return "Meeting Expectation. A good, steady grasp of the competencies covered.";
    if(cat === "AE") return "Approaching Expectation. On track, but needs more practice to fully master the competencies.";
    return "Below Expectation. Needs close support to grasp the competencies covered.";
  }

  function assignedGradesForTeacher(teacherId){
    var set = {};
    assignmentsList.forEach(function(a){ if(a.teacher_id === teacherId) set[a.grade] = true; });
    return Object.keys(set).sort();
  }
  function assignedSubjectIdsForTeacherInGrade(teacherId, grade){
    return assignmentsList.filter(function(a){ return a.teacher_id === teacherId && a.grade === grade; })
      .map(function(a){ return a.subject_id; });
  }
  function subjectTeacherName(grade, subjectId){
    var a = assignmentsList.find(function(x){ return x.grade === grade && x.subject_id === subjectId; });
    if(!a) return null;
    var t = teachersList.find(function(tt){ return tt.id === a.teacher_id; });
    return t ? t.full_name : null;
  }

        readImageAsCompressedDataURL(file, 360, 0.82, async function(dataUrl){
          if(!dataUrl){ alert("That file could not be used as an image. Please try a different photo."); return; }
          var updRes = await sb.from("schools").update({ logo:dataUrl }).eq("id", id);
          if(updRes.error){ alert("Could not save the logo: " + friendlyError(updRes.error)); return; }
          renderTab();
        });
      });
    });
    c.querySelectorAll("[data-school-field]").forEach(function(inp){
      inp.addEventListener("change", async function(){
        var id = inp.getAttribute("data-school-id");
        var f = inp.getAttribute("data-school-field");
        var patch = {}; patch[f] = inp.value;
        var res = await sb.from("schools").update(patch).eq("id", id);
        if(res.error) alert("Could not save: " + friendlyError(res.error));
      });
    });
    c.querySelectorAll("[data-toggle-school]").forEach(function(btn){
      btn.onclick = async function(){
        var id = btn.getAttribute("data-toggle-school");
        var currentlyActive = btn.getAttribute("data-currently-active") === "true";
        var newActive = !currentlyActive;
        var verb = newActive ? "reactivate" : "deactivate";
        var warning = newActive
          ? "Reactivate this school? Its admin and teachers will be able to sign in again."
          : "Deactivate this school? Its admin and teachers won't be able to sign in until it's reactivated. All data (teachers, students, marks) stays intact and untouched.";
        if(!confirm(warning)) return;
        btn.disabled = true;
        var res = await sb.from("schools").update({ is_active: newActive }).eq("id", id);
        if(res.error){ alert("Could not " + verb + " the school: " + friendlyError(res.error)); btn.disabled = false; return; }
        renderTab();
      };
    });

    c.querySelectorAll("[data-admin-pass]").forEach(function(inp){
      inp.addEventListener("change", async function(){
        var id = inp.getAttribute("data-admin-pass");
        if(!inp.value) return;
        var res = await sb.functions.invoke("manage-user", { body: { action:"update_password", user_id:id, password: inp.value } });
        if(res.error || (res.data && res.data.error)){ alert("Could not update the password: " + friendlyError(res.error || res.data)); return; }
        inp.value = "";
        alert("Password updated.");
      });
    });

    c.querySelectorAll("[data-delete-school]").forEach(function(btn){
      btn.onclick = async function(){
        var id = btn.getAttribute("data-delete-school");
        var name = btn.getAttribute("data-delete-school-name");
        if(!confirm("Permanently delete \""+name+"\"? This deletes the school and ALL its data \u2014 teachers, students, subjects, marks, exams \u2014 forever. This cannot be undone.")) return;
        if(!confirm("Are you absolutely sure? Type OK in the next box only if you really want to delete \""+name+"\" permanently.")) return;
        btn.disabled = true;
        var res = await sb.from("schools").delete().eq("id", id);
        if(res.error){ alert("Could not delete the school: " + friendlyError(res.error)); btn.disabled = false; return; }
        renderTab();
      };
    });

    c.querySelectorAll("[data-save-sub]").forEach(function(btn){
      btn.onclick = async function(){
        var key = btn.getAttribute("data-save-sub");
        var parts = key.split("|");
        var schoolId = parts[0], grade = parts[1];
        var amountInp = c.querySelector('[data-sub-amount="'+key+'"]');
        var dateInp = c.querySelector('[data-sub-date="'+key+'"]');
        var amount = Number(amountInp.value) || 0;
        var dateVal = dateInp.value;
        if(!dateVal){ alert("Please pick a 'Paid until' date."); return; }
        var paidUntil = new Date(dateVal + "T23:59:59");
        btn.disabled = true;
        var res = await sb.from("class_subscriptions").upsert(
          { school_id: schoolId, grade: grade, amount: amount, paid_until: paidUntil.toISOString(), updated_at: new Date().toISOString() },
          { onConflict: "school_id,grade" }
        );
        if(res.error){ alert("Could not save the subscription: " + friendlyError(res.error)); btn.disabled = false; return; }
        renderTab();
      };
    });
  }

  /* ---------------- School admin: Assignments tab ---------------- */

  async function renderAssignments(c){
    var sch = currentSchool;
    var html = '<h2 class="section-title">Assignments</h2>' +
      '<p class="section-hint">Assign a teacher to a class and a subject. Add subjects for each grade in Setup first.</p>';

    if(teachersList.length === 0){
      html += '<div class="empty-state"><strong>Add teachers first</strong>Go to the Teachers tab to add teacher accounts before assigning them.</div>';
      c.innerHTML = html;
      return;
    }

    var subjRes = await sb.from("subjects").select("*").eq("school_id", sch.id).order("grade").order("name");
    var schoolGrades = gradesForSchool(sch);
    var subjectsByGrade = {};
    schoolGrades.forEach(function(g){ subjectsByGrade[g] = []; });
    (subjRes.data || []).forEach(function(s){ subjectsByGrade[s.grade].push(s); });

    html += '<div class="panel"><h3>New assignment</h3><div class="row">' +
      '<div class="field"><label>Class</label><select id="assignGrade">' +
      schoolGrades.map(function(g){ return '<option value="'+g+'">Grade '+g+'</option>'; }).join("") +
      '</select></div>' +
      '<div class="field"><label>Subject</label><select id="assignSubject"></select></div>' +
      '<div class="field"><label>Teacher</label><select id="assignTeacher">' +
      teachersList.map(function(t){ return '<option value="'+t.id+'">'+esc(t.full_name||t.email)+'</option>'; }).join("") +
      '</select></div>' +
      '<button class="btn" id="addAssignmentBtn">Assign</button>' +
      '</div></div>';

    html += '<div class="panel"><h3>Current assignments</h3>';
    if(assignmentsList.length === 0){
      html += '<div class="empty-state"><strong>No assignments yet</strong>Use the form above to assign teachers to classes and subjects.</div>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr><th>Class</th><th>Subject</th><th>Teacher</th><th style="width:60px"></th></tr></thead><tbody>';
      assignmentsList.slice().sort(function(a,b){ return a.grade.localeCompare(b.grade); }).forEach(function(a){
        var subj = subjectsByGrade[a.grade].find(function(s){ return s.id === a.subject_id; });
        var teach = teachersList.find(function(t){ return t.id === a.teacher_id; });
        html += '<tr><td>Grade '+esc(a.grade)+'</td><td>'+esc(subj ? subj.name : "(removed)")+'</td><td>'+esc(teach ? teach.full_name : "(removed)")+'</td>' +
          '<td><button class="icon-x" data-remove-assignment="'+a.id+'" title="Remove assignment">&times;</button></td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';

    c.innerHTML = html;

    var gradeSel = c.querySelector("#assignGrade");
    var subjSel = c.querySelector("#assignSubject");
    function refreshSubjectOptions(){
      var subs = subjectsByGrade[gradeSel.value];
      subjSel.innerHTML = subs.length
        ? subs.map(function(s){ return '<option value="'+s.id+'">'+esc(s.name)+'</option>'; }).join("")
        : '<option value="">No subjects for this grade yet</option>';
    }
    gradeSel.onchange = refreshSubjectOptions;
    refreshSubjectOptions();

    c.querySelector("#addAssignmentBtn").onclick = async function(){
      var g = gradeSel.value;
      var subjId = subjSel.value;
      var teachId = c.querySelector("#assignTeacher").value;
      if(!subjId){ alert("This grade has no subjects yet - add one in Setup first."); return; }
      await sb.from("assignments").delete().eq("school_id", sch.id).eq("grade", g).eq("subject_id", subjId);
      var res = await sb.from("assignments").insert({ school_id: sch.id, grade:g, subject_id:subjId, teacher_id:teachId });
      if(res.error){ alert("Could not save the assignment: " + friendlyError(res.error)); return; }
      await loadSchoolMeta();
      renderTab();
    };
    c.querySelectorAll("[data-remove-assignment]").forEach(function(btn){
      btn.onclick = async function(){
        var id = btn.getAttribute("data-remove-assignment");
        var res = await sb.from("assignments").delete().eq("id", id);
        if(res.error){ alert("Could not remove the assignment: " + friendlyError(res.error)); return; }
        await loadSchoolMeta();
        renderTab();
      };
    });
  }

          ' <button class="icon-x" data-remove-exam="'+e.id+'" data-remove-exam-name="'+esc(e.name)+'" title="Delete exam">&times;</button></td></tr>';

      '<div class="table-wrap"><table><thead><tr><th>Category</th><th>Level</th><th>From</th><th>To</th><th>Points</th><th>Remark</th></tr></thead><tbody>';
    gradeScale().slice().sort(function(a,b){return b.min-a.min;}).forEach(function(g,i){
      html += '<tr>' +
        '<td><input type="text" class="mark-input" style="width:50px" data-scale-field="category" data-scale-idx="'+i+'" value="'+esc(g.category||"")+'"></td>' +
        '<td><input type="text" class="mark-input" style="width:55px" data-scale-field="grade" data-scale-idx="'+i+'" value="'+esc(g.grade)+'"></td>' +
        '<td><input type="number" class="mark-input" data-scale-field="min" data-scale-idx="'+i+'" value="'+g.min+'"></td>' +
        '<td><input type="number" class="mark-input" data-scale-field="max" data-scale-idx="'+i+'" value="'+g.max+'"></td>' +
        '<td><input type="number" class="mark-input" style="width:50px" data-scale-field="points" data-scale-idx="'+i+'" value="'+(g.points!==undefined?g.points:"")+'"></td>' +

        var res = await sb.from("subjects").delete().eq("id", id);
        if(res.error){ alert("Could not remove the subject: " + friendlyError(res.error)); return; }
        await loadSchoolMeta();
        renderTab();
      };
    });
    c.querySelector("#addExamBtn").onclick = async function(){
      var inp = c.querySelector("#newExamName");
      var name = inp.value.trim();
      if(!name) return;
      var already = examHistory.some(function(e){ return e.name.toLowerCase() === name.toLowerCase(); });
      if(!already){
        var res = await sb.from("exams").insert({ school_id: sch.id, name: name }).select().single();
        if(res.error){ alert("Could not add the exam: " + friendlyError(res.error)); return; }
        examHistory.unshift(res.data);
      }
      var patchRes = await sb.from("schools").update({ exam: name }).eq("id", sch.id);
      if(patchRes.error){ alert("Could not set the exam: " + friendlyError(patchRes.error)); return; }
      sch.exam = name;
      renderShell();
      renderTab();
    };
    c.querySelectorAll("[data-use-exam]").forEach(function(btn){
      btn.onclick = async function(){
        var name = btn.getAttribute("data-use-exam");
        var res = await sb.from("schools").update({ exam: name }).eq("id", sch.id);
        if(res.error){ alert("Could not switch exam: " + friendlyError(res.error)); return; }
        sch.exam = name;
        renderShell();
        renderTab();
      };
    });
    c.querySelectorAll("[data-remove-exam]").forEach(function(btn){
      btn.onclick = async function(){
        var id = btn.getAttribute("data-remove-exam");
        var name = btn.getAttribute("data-remove-exam-name");
        if(!confirm("Delete the exam \""+name+"\" from the list? This only removes it from your list of exam names \u2014 it does not delete any marks.")) return;
        var res = await sb.from("exams").delete().eq("id", id);
        if(res.error){ alert("Could not delete the exam: " + friendlyError(res.error)); return; }
        examHistory = examHistory.filter(function(e){ return e.id !== id; });
        renderTab();
      };
    });
    c.querySelectorAll("[data-scale-field]").forEach(function(inp){
      inp.addEventListener("change", async function(){
        var idx = Number(inp.getAttribute("data-scale-idx"));
        var f = inp.getAttribute("data-scale-field");
        var sorted = gradeScale().slice().sort(function(a,b){return b.min-a.min;});
        var target = sorted[idx];
        var realIdx = sch.grade_scale.indexOf(target);
        if(f === "min" || f === "max" || f === "points"){ sch.grade_scale[realIdx][f] = Number(inp.value); }
        else { sch.grade_scale[realIdx][f] = inp.value; }
        setSaveNote("Saving...", false);
        var res = await sb.from("schools").update({ grade_scale: sch.grade_scale }).eq("id", sch.id);
        setSaveNote(res.error ? "Could not save" : "All changes saved", !res.error);
      });
    });
    c.querySelector("#resetClassBtn").onclick = async function(){
      if(!confirm("This clears subjects, students, marks and assignments for Grade "+currentGrade+" only. Continue?")) return;
      var subjIds = classCache.subjects.map(function(s){ return s.id; });
      if(subjIds.length){ await sb.from("marks").delete().in("subject_id", subjIds); }
      await sb.from("assignments").delete().eq("school_id", sch.id).eq("grade", currentGrade);
      await sb.from("students").delete().eq("school_id", sch.id).eq("grade", currentGrade);
      await sb.from("subjects").delete().eq("school_id", sch.id).eq("grade", currentGrade);
      await loadSchoolMeta();
      renderTab();
    };
  }

    html += '<div class="panel"><h3>Import a class list</h3>' +

      '<div class="row">' +
      '<div class="field"><label>Upload a file (.txt or .csv)</label><input type="file" id="importListFile" accept=".txt,.csv"></div>' +
      '<div class="field"><label>Or upload a photo of the list</label><input type="file" id="importPhotoFile" accept="image/*"></div>' +

      '<button class="btn" id="importAddBtn" style="margin-top:8px;">Add these as students</button>' +
      '</div>';

    if(classCache.students.length === 0){
      html += '<div class="empty-state"><strong>No students added yet</strong>Add learners above to start keying in their marks.</div>';
    } else {
      html += '<div class="panel"><div class="table-wrap"><table><thead><tr><th style="width:40px">#</th><th>Name</th><th>Admission No.</th><th style="width:150px;">Parent phone</th><th style="width:60px"></th></tr></thead><tbody>';
      classCache.students.forEach(function(st,i){
        html += '<tr><td>'+(i+1)+'</td>' +
          '<td><input type="text" data-student-field="name" data-student-id="'+st.id+'" value="'+esc(st.name)+'" style="width:100%"></td>' +
          '<td><input type="text" data-student-field="adm" data-student-id="'+st.id+'" value="'+esc(st.adm||"")+'" style="width:100px"></td>' +
          '<td><input type="text" data-student-field="phone" data-student-id="'+st.id+'" value="'+esc(st.parentPhone||"")+'" style="width:100%" placeholder="e.g. 0712345678"></td>' +
          '<td><button class="icon-x" data-remove-student="'+st.id+'" title="Remove student">&times;</button></td>' +
          '</tr>';
      });
      html += '</tbody></table></div></div>';
    }

    c.innerHTML = html;

    c.querySelector("#addStudentBtn").onclick = async function(){
      var nameInp = c.querySelector("#newStudentName");
      var admInp = c.querySelector("#newStudentAdm");
      var phoneInp = c.querySelector("#newStudentParentPhone");
      var name = nameInp.value.trim();
      if(!name) return;
      var res = await sb.from("students").insert({ school_id: sch.id, grade: currentGrade, name:name, admission_no: admInp.value.trim() || null, parent_phone: phoneInp.value.trim() || null });
      if(res.error){ alert("Could not add the student: " + friendlyError(res.error)); return; }
      renderTab();
    };
    c.querySelectorAll("[data-student-field]").forEach(function(inp){
      inp.addEventListener("change", async function(){
        var id = inp.getAttribute("data-student-id");
        var f = inp.getAttribute("data-student-field");
        var fieldMap = { adm:"admission_no", name:"name", phone:"parent_phone" };
        var patch = {}; patch[fieldMap[f]] = inp.value;
        var res = await sb.from("students").update(patch).eq("id", id);
        if(res.error) alert("Could not save: " + friendlyError(res.error));
      });
    });
    c.querySelectorAll("[data-remove-student]").forEach(function(btn){
      btn.onclick = async function(){
        var id = btn.getAttribute("data-remove-student");
        if(!confirm("Remove this student and their marks?")) return;
        var res = await sb.from("students").delete().eq("id", id);
        if(res.error){ alert("Could not remove the student: " + friendlyError(res.error)); return; }
        renderTab();
      };
    });

    var importStatus = c.querySelector("#importStatus");
    var importPreview = c.querySelector("#importPreview");

    c.querySelector("#importListFile").addEventListener("change", function(e){
      var file = e.target.files[0];
      if(!file) return;
      importStatus.textContent = "Reading file...";
      var reader = new FileReader();
      reader.onload = function(){
        var lines = String(reader.result).split(/\r?\n/).map(function(l){ return l.split(",")[0].trim(); }).filter(Boolean);
        importPreview.value = lines.join("\n");
        importStatus.textContent = lines.length + " name(s) found. Check the list below, then click 'Add these as students'.";
      };
      reader.readAsText(file);
    });

    function loadTesseractOnce(){
      if(window.Tesseract) return Promise.resolve();
      return new Promise(function(resolve, reject){
        var s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    c.querySelector("#importPhotoFile").addEventListener("change", async function(e){
      var file = e.target.files[0];
      if(!file) return;
      importStatus.textContent = "Loading the scanner (first time only)...";
      try{
        await loadTesseractOnce();
        importStatus.textContent = "Scanning photo for names \u2014 this can take a little while...";
        var result = await Tesseract.recognize(file, "eng");
        var lines = result.data.text.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
        importPreview.value = lines.join("\n");
        importStatus.textContent = lines.length + " line(s) found from the photo. Please check carefully and fix any misread names before adding, then click 'Add these as students'.";
      } catch(err){
        importStatus.textContent = "Could not scan the photo: " + (err && err.message ? err.message : err);
      }
    });

    c.querySelector("#importAddBtn").onclick = async function(){
      var names = importPreview.value.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
      if(names.length === 0){ alert("Nothing to add yet \u2014 upload a file or photo first, or type names into the box."); return; }
      if(!confirm("Add "+names.length+" student(s) to Grade "+currentGrade+"?")) return;
      var btn = c.querySelector("#importAddBtn");
      btn.disabled = true; btn.textContent = "Adding...";
      var rows = names.map(function(n){ return { school_id: sch.id, grade: currentGrade, name: n }; });
      var res = await sb.from("students").insert(rows);
      btn.disabled = false; btn.textContent = "Add these as students";
      if(res.error){ alert("Could not add the students: " + friendlyError(res.error)); return; }
      renderTab();
    };
  }

  /* ---------------- Marks entry tab (per class) ---------------- */

  function renderMarks(c){
    var html = '<h2 class="section-title">Marks Entry &mdash; Grade '+esc(currentGrade)+'</h2>' +
      '<p class="section-hint">Type a mark out of 100 for each learner and subject. Grades update automatically as you type.</p>';

    if(classCache.subjects.length === 0 || classCache.students.length === 0){
      html += '<div class="empty-state"><strong>Add subjects and students first</strong>Subjects and learners for this class need to be added before keying in marks.</div>';
      c.innerHTML = html;
      return;
    }

    var teacherAssignedIds = null;
    if(profile.role === "teacher"){
      teacherAssignedIds = assignedSubjectIdsForTeacherInGrade(profile.id, currentGrade);
    }

    html += '<div class="panel"><div class="table-wrap"><table><thead><tr><th style="min-width:160px;">Student</th>';
    classCache.subjects.forEach(function(s){
      html += '<th style="min-width:110px;">'+esc(s.name) + '</th>';
    });
    html += '<th style="min-width:70px;">Total</th><th style="min-width:70px;">Average</th><th style="min-width:70px;">Level</th></tr></thead><tbody>';

    classCache.students.forEach(function(st){
      var sum = studentSummary(st.id);
      html += '<tr><td>'+esc(st.name)+'</td>';
      classCache.subjects.forEach(function(s){
        var v = (classCache.marks[st.id] || {})[s.id];
        v = (v === undefined || v === null) ? "" : v;
        var editable = !teacherAssignedIds || teacherAssignedIds.indexOf(s.id) !== -1;
        html += '<td><input class="mark-input" type="number" min="0" max="100" data-mark-student="'+st.id+'" data-mark-subject="'+s.id+'" value="'+esc(v)+'"'+(editable?'':' disabled title="Not assigned to you"')+'></td>';
      });
      html += '<td>'+(sum.total===null?"-":sum.total)+'</td>';
      html += '<td>'+(sum.average===null?"-":sum.average.toFixed(1))+'</td>';
      html += '<td>'+gradePillHTML(sum.average)+'</td></tr>';
    });
    html += '</tbody></table></div>' +
      '<p class="section-hint" style="margin:12px 0 0;">Total and average only count subjects that already have a mark entered.' +
      (teacherAssignedIds ? ' Greyed-out columns are subjects assigned to another teacher.' : '') + '</p></div>';

    c.innerHTML = html;

    var sch = currentSchool;
    c.querySelectorAll("[data-mark-student]").forEach(function(inp){
      var saveTimer = null;
      inp.addEventListener("input", function(){
        var sid = inp.getAttribute("data-mark-student");
        var subid = inp.getAttribute("data-mark-subject");
        var raw = inp.value;
        var n = raw === "" ? null : Math.max(0, Math.min(100, Number(raw)));
        if(!classCache.marks[sid]) classCache.marks[sid] = {};
        if(n === null) delete classCache.marks[sid][subid]; else classCache.marks[sid][subid] = n;

        var row = inp.closest("tr");
        var sum = studentSummary(sid);
        row.children[classCache.subjects.length+1].textContent = sum.total===null?"-":sum.total;
        row.children[classCache.subjects.length+2].textContent = sum.average===null?"-":sum.average.toFixed(1);
        row.children[classCache.subjects.length+3].innerHTML = gradePillHTML(sum.average);

        clearTimeout(saveTimer);
        saveTimer = setTimeout(async function(){
          var res = await sb.from("marks").upsert(
            { school_id: sch.id, student_id: sid, subject_id: subid, score: n },
            { onConflict: "student_id,subject_id" }
          );
          if(res.error) console.error(res.error);
        }, 350);
      });
    });
  }

  function printableFileWrapper(title, bodyHtml, pageSize){
    return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title>' +
      '<style>' +
      'body{font-family:Georgia,"Times New Roman",serif;color:#222;margin:0;padding:20px;} ' +
      'table{border-collapse:collapse;width:100%;} ' +
      'th,td{border:1px solid #333;padding:5px 7px;font-size:12px;} ' +
      'h2{text-align:center;margin:0 0 4px;} ' +
      '.rc-head{text-align:center;margin-bottom:14px;} ' +
      '.rc-sub{font-size:12px;color:#555;} ' +
      '.rc-info{margin-bottom:10px;} ' +
      '.rc-foot{margin-top:26px;} ' +
      '@media print{ @page{ size: '+pageSize+'; margin: 12mm; } body{padding:0;} }' +
      '</style></head><body onload="setTimeout(function(){ window.print(); }, 300);">' + bodyHtml + '</body></html>';
  }

  function downloadHtmlFile(filename, html){
    var blob = new Blob([html], { type: "text/html;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function downloadMarklistFile(){
    var sch = currentSchool;
    var doc = printableFileWrapper("Marklist", buildMarklistHTML(), "A4 landscape");
    var safeName = (sch.name || "marklist").replace(/[^a-z0-9]+/gi, "_");
    var safeExam = (sch.exam || "exam").replace(/[^a-z0-9]+/gi, "_");
    downloadHtmlFile(safeName + "_Grade" + currentGrade + "_" + safeExam + "_Marklist.html", doc);
  }

  function buildMarklistHTML(){
    var sch = currentSchool;
    var head = '<div class="report-card" style="max-width:100%;">' +
      '<div class="rc-head">' + (sch.logo ? '<img src="'+sch.logo+'" alt="School logo" style="max-height:60px;max-width:170px;margin-bottom:8px;">' : '') +
      '<h2>'+esc(sch.name || "Junior School")+'</h2>' +
      '<div class="rc-sub">'+esc(sch.exam || "Exam")+' &middot; '+esc(sch.term || "")+' '+esc(sch.year || "")+' &middot; Grade '+esc(currentGrade)+' Marklist</div></div>';

    var headerRow1 = '<th rowspan="2">Student</th>';
    var headerRow2 = '';
    classCache.subjects.forEach(function(s){
      headerRow1 += '<th colspan="2">'+esc(s.name)+'</th>';
      headerRow2 += '<th style="text-align:center;">Marks</th><th style="text-align:center;">Level</th>';
    });
    headerRow1 += '<th rowspan="2">Total</th><th rowspan="2">Average</th><th rowspan="2">Overall Level</th>';

    var bodyRows = classCache.students.map(function(st){
      var sum = studentSummary(st.id);
      var overall = getGradeInfo(sum.average);
      var row = '<tr><td>'+esc(st.name)+'</td>';
      classCache.subjects.forEach(function(s){
        var v = (classCache.marks[st.id] || {})[s.id];
        var hasVal = v !== undefined && v !== null && v !== "";
        var g = hasVal ? getGradeInfo(Number(v)) : null;
        row += '<td style="text-align:center;">'+(hasVal ? v : "-")+'</td><td style="text-align:center;">'+(g ? g.grade : "-")+'</td>';
      });
      row += '<td style="text-align:center;">'+(sum.total===null?"-":sum.total)+'</td>';
      row += '<td style="text-align:center;">'+(sum.average===null?"-":sum.average.toFixed(1))+'</td>';
      row += '<td style="text-align:center;">'+(overall ? overall.grade : "-")+'</td></tr>';
      return row;
    }).join("");

    var classAvgOfAverages = (function(){
      var sum = 0, count = 0;
      classCache.students.forEach(function(st){
        var s = studentSummary(st.id);
        if(s.average !== null){ sum += s.average; count++; }
      });
      return count ? sum / count : null;
    })();
    var summaryRow = '<tr style="font-weight:bold;background:var(--paper-dark);">' +
      '<td>Subject Mean</td>';
    classCache.subjects.forEach(function(s){
      var m = subjectMean(s.id);
      var g = m===null ? null : getGradeInfo(m);
      summaryRow += '<td style="text-align:center;">'+(m===null?"-":m.toFixed(1))+'</td><td style="text-align:center;">'+(g?g.grade:"-")+'</td>';
    });
    var classOverall = classAvgOfAverages===null ? null : getGradeInfo(classAvgOfAverages);
    summaryRow += '<td style="text-align:center;">-</td>' +
      '<td style="text-align:center;">'+(classAvgOfAverages===null?"-":classAvgOfAverages.toFixed(1))+'</td>' +
      '<td style="text-align:center;">'+(classOverall?classOverall.grade:"-")+'</td></tr>';

    var table = '<div class="table-wrap"><table><thead><tr>'+headerRow1+'</tr><tr>'+headerRow2+'</tr></thead><tbody>'+bodyRows+summaryRow+'</tbody></table></div>';
    return head + table + '</div>';
  }

  function subjectMean(subjectId){
    var sum = 0, count = 0;
    classCache.students.forEach(function(st){
      var v = (classCache.marks[st.id] || {})[subjectId];
      if(v !== undefined && v !== null && v !== ""){ sum += Number(v); count++; }
    });
    return count ? sum / count : null;
  }

  /* ---------------- Analysis tab (per class) ---------------- */

  function renderAnalysis(c){
    var html = '<h2 class="section-title">Class Analysis &mdash; Grade '+esc(currentGrade)+'</h2>' +
      '<p class="section-hint">A summary of how the class performed, updated live from the marks entered.</p>';

    if(classCache.subjects.length === 0 || classCache.students.length === 0){
      html += '<div class="empty-state"><strong>Nothing to analyze yet</strong>Add subjects, students, and marks first.</div>';
      c.innerHTML = html;
      return;
    }

    var classMean = overallClassMean();
    var rankData = rankedStudents();
    var top = rankData.ranked[0];
    var bottom = rankData.ranked[rankData.ranked.length-1];

    html += '<div class="stat-grid">' +
      statBox("Class mean score", classMean===null?"-":classMean.toFixed(1)) +
      statBox("Students marked", rankData.totalRanked + " / " + classCache.students.length) +
      statBox("Top performer", top ? esc(top.student.name) : "-", top ? "Avg "+top.summary.average.toFixed(1) : "") +
      statBox("Needs most support", bottom ? esc(bottom.student.name) : "-", bottom ? "Avg "+bottom.summary.average.toFixed(1) : "") +
      '</div>';

    html += '<div class="panel"><h3>Subject performance</h3>';
    var subjStats = classCache.subjects.map(function(s){ return { subject:s, stats: subjectStats(s.id) }; });
    subjStats.sort(function(a,b){
      var am = a.stats.mean===null ? -1 : a.stats.mean;
      var bm = b.stats.mean===null ? -1 : b.stats.mean;
      return bm - am;
    });
    subjStats.forEach(function(item){
      var mean = item.stats.mean;
      var pct = mean===null ? 0 : Math.round((mean/100)*100);
      html += '<div class="bar-row"><div class="bar-label">'+esc(item.subject.name)+'</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;"></div></div>' +
        '<div class="bar-value">'+(mean===null?"-":mean.toFixed(1))+'</div></div>';
    });
    html += '</div>';

    html += '<div class="panel"><h3>Subject detail</h3><div class="table-wrap"><table><thead><tr>' +
      '<th>Subject</th><th>Mean</th><th>Highest</th><th>Lowest</th><th>Level</th><th>Entries</th></tr></thead><tbody>';
    subjStats.forEach(function(item){
      html += '<tr><td>'+esc(item.subject.name)+'</td>' +
        '<td>'+(item.stats.mean===null?"-":item.stats.mean.toFixed(1))+'</td>' +
        '<td>'+(item.stats.high===null?"-":item.stats.high)+'</td>' +
        '<td>'+(item.stats.low===null?"-":item.stats.low)+'</td>' +
        '<td>'+gradePillHTML(item.stats.mean)+'</td>' +
        '<td>'+item.stats.count+' / '+classCache.students.length+'</td></tr>';
    });
    html += '</tbody></table></div></div>';

    html += '<div class="panel"><h3>Class ranking</h3><div class="table-wrap"><table><thead><tr>' +
      '<th style="width:60px;">Position</th><th>Student</th><th>Total</th><th>Average</th><th>Level</th></tr></thead><tbody>';
    rankData.ranked.forEach(function(r){
      html += '<tr><td>'+r.position+'</td><td>'+esc(r.student.name)+'</td>' +
        '<td>'+r.summary.total+'</td><td>'+r.summary.average.toFixed(1)+'</td>' +
        '<td>'+gradePillHTML(r.summary.average)+'</td></tr>';
    });
    rankData.unranked.forEach(function(r){
      html += '<tr><td>-</td><td>'+esc(r.student.name)+'</td><td>-</td><td>-</td><td>-</td></tr>';
    });
    html += '</tbody></table></div></div>';

    c.innerHTML = html;
  }

  function statBox(label,value,sub){
    return '<div class="stat-box"><div class="label">'+esc(label)+'</div>' +
      '<div class="value'+(String(value).length>10?" small":"")+'">'+esc(value)+'</div>' +
      (sub ? '<div class="label">'+esc(sub)+'</div>' : '') + '</div>';
  }

    html += '<p class="section-hint" id="smsStatus"></p>';
    html += '<div id="reportPreview"></div>';
    c.innerHTML = html;

    var examSelect = c.querySelector("#reportExamSelect");
    var studentSelect = c.querySelector("#reportStudentSelect");

    function refreshPreview(){

    examSelect.onchange = refreshPreview;
    studentSelect.onchange = refreshPreview;
    refreshPreview();

      window.print();

      }).join("");
      document.getElementById("printArea").innerHTML = all;
      window.print();

    c.querySelector("#smsOneBtn").onclick = async function(){
      var statusEl = c.querySelector("#smsStatus");
      var st = classCache.students.find(function(s){ return s.id === studentSelect.value; });
      if(!st){ return; }
      if(!st.parentPhone){ statusEl.textContent = "No parent phone number saved for "+st.name+". Add one in the Students tab first."; return; }
      var sum = studentSummary(st.id);
      var overall = getGradeInfo(sum.average);
      var message = st.name+": "+examSelect.value+" results - Total "+(sum.total===null?"-":sum.total)+"/"+(classCache.subjects.length*100)+", Average "+(sum.average===null?"-":sum.average.toFixed(1))+", Overall "+(overall?overall.grade:"-")+". - "+ (currentSchool.name||"School");
      statusEl.textContent = "Sending SMS to "+st.parentPhone+"...";
      var res = await sb.functions.invoke("send-sms", { body: { phone: st.parentPhone, message: message } });
      if(res.error || (res.data && res.data.error)){
        statusEl.textContent = "Could not send the SMS: " + friendlyError(res.error || res.data);
        return;
      }
      statusEl.textContent = "SMS sent to "+st.parentPhone+".";
    };
  }

  function downloadReportCardFile(studentId, examLabel){
    var sch = currentSchool;
    var st = classCache.students.find(function(s){ return s.id === studentId; });
    var doc = printableFileWrapper("Report Card", buildReportCardHTML(studentId, examLabel), "A4");
    var safeName = ((st && st.name) || "report_card").replace(/[^a-z0-9]+/gi, "_");
    var safeExam = (examLabel || sch.exam || "exam").replace(/[^a-z0-9]+/gi, "_");
    downloadHtmlFile(safeName + "_Grade" + currentGrade + "_" + safeExam + "_ReportCard.html", doc);
  }

  function buildReportCardHTML(studentId, examLabel){
    var sch = currentSchool;
    var st = classCache.students.find(function(s){ return s.id === studentId; });
    if(!st) return "";
    var sum = studentSummary(studentId);
    var rankData = rankedStudents();
    var posEntry = rankData.ranked.find(function(r){ return r.student.id === studentId; });
    var position = posEntry ? posEntry.position : null;

    var rows = classCache.subjects.map(function(s){
      var v = (classCache.marks[studentId] || {})[s.id];
      var hasVal = v !== undefined && v !== null && v !== "";
      var g = hasVal ? getGradeInfo(Number(v)) : null;
      var tname = subjectTeacherName(currentGrade, s.id);
      return '<tr><td>'+esc(s.name)+'</td><td style="text-align:center;">'+(hasVal?v:"-")+'</td>' +
        '<td style="text-align:center;">'+(g?g.grade:"-")+'</td><td>'+(g?esc(g.remark):"-")+'</td>' +
        '<td>'+(tname?esc(tname):"-")+'</td></tr>';
    }).join("");

    var overallGrade = getGradeInfo(sum.average);

    return '<div class="report-card">' +
      '<div class="rc-head">' + (sch.logo ? '<img src="'+sch.logo+'" alt="School logo" style="max-height:60px;max-width:170px;margin-bottom:8px;">' : '') + '<h2>'+esc(sch.name || "Junior School")+'</h2>' +
      '<div class="rc-sub">'+esc(examLabel || sch.exam || "Exam")+' &middot; '+esc(sch.term || "")+' '+esc(sch.year || "")+'</div></div>' +
      '<div class="rc-info"><div><strong>Name:</strong> '+esc(st.name)+'</div>' +
      '<div><strong>Admission No.:</strong> '+esc(st.adm || "-")+'</div>' +
      '<div><strong>Class:</strong> Grade '+esc(currentGrade)+'</div></div>' +
      '<table><thead><tr><th>Subject</th><th style="text-align:center;">Marks</th><th style="text-align:center;">Level</th><th>Remark</th><th>Teacher</th></tr></thead>' +
      '<tbody>'+rows+'</tbody></table>' +
      '<div class="rc-info" style="margin-top:14px;">' +
      '<div><strong>Total:</strong> '+(sum.total===null?"-":sum.total)+'</div>' +
      '<div><strong>Average:</strong> '+(sum.average===null?"-":sum.average.toFixed(1))+'</div>' +
      '<div><strong>Overall level:</strong> '+(overallGrade?esc(overallGrade.grade)+" ("+esc(overallGrade.category||"")+")":"-")+'</div>' +
      '<div><strong>Position:</strong> '+(position?position+" out of "+rankData.totalRanked:"-")+'</div></div>' +
      '<div class="rc-remark"><span class="label">Class teacher remark</span>'+esc(autoRemark(sum.average))+'</div>' +
      '<div class="rc-foot"><div>Class Teacher</div><div>Head Teacher</div></div>' +
      '</div>';
  }

  /* ---------------- Boot ---------------- */

  async function boot(){
    try{
      var hash = window.location.hash || "";
      var isRecovery = hash.indexOf("type=recovery") !== -1;
      var sessRes = await sb.auth.getSession();
      var session = sessRes.data && sessRes.data.session;
      if(isRecovery && session){ renderSetNewPassword(); return; }
      if(session){ await handleSignedIn(session.user); }
      else { renderApp(); }
    } catch(e){
      showFatalError(e);
      renderApp();
    }
  }

  function showFatalError(e){
    console.error(e);
    var msg = (e && e.message) ? e.message : String(e);
    var banner = document.getElementById("fatalErrorBanner");
    if(!banner){
      banner = document.createElement("div");
      banner.id = "fatalErrorBanner";
      banner.style.cssText = "position:fixed;top:0;left:0;right:0;background:#B23A2E;color:#fff;padding:10px 16px;font-family:sans-serif;font-size:13px;z-index:9999;text-align:center;";
      document.body.insertBefore(banner, document.body.firstChild);
    }
    banner.textContent = "Something went wrong loading the app: " + msg + " (please screenshot this message)";
  }

  window.addEventListener("error", function(e){ showFatalError(e.error || e.message || e); });
  window.addEventListener("unhandledrejection", function(e){ showFatalError(e.reason); });

  boot();
})();
</script>
</body>
</html>
